<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tally</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='15' fill='%23141413'/%3E%3Cpath d='M21 16v32M28.5 16v32M36 16v32M43.5 16v32' stroke='%23f3f2ee' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M13.5 43.5L51 21.5' stroke='%23141413' stroke-width='12' stroke-linecap='round'/%3E%3Cpath d='M13.5 43.5L51 21.5' stroke='%23eb6834' stroke-width='5' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
/* ---------------------------------------------------------------- tokens */
.viz-root {
  color-scheme: light;
  --page: #f6f6f3;
  --surface-1: #fdfdfc;
  --surface-2: #f1f0ec;
  --text-primary: #0b0b0b;
  --text-secondary: #4a4946;
  --text-muted: #6c6a65;      /* 5:1 on the surfaces */
  --grid: #e6e5df;
  --baseline: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --border-strong: rgba(11,11,11,0.18);
  --hover: rgba(11,11,11,0.04);
  --select: rgba(42,120,214,0.10);
  --accent: #d9541f;          /* the logo's orange, text-safe */
  --accent-soft: rgba(235,104,52,0.12);
  --series-1: #2a78d6;  /* input        */
  --series-2: #eb6834;  /* output       */
  --series-3: #1baf7a;  /* cache write  */
  --series-4: #eda100;  /* cache read   */
  --seq: #2a78d6;       /* token share (single hue, magnitude) */
  --seq-track: #e6e5df;
  --good: #0c8f0c;
  --critical: #c9302c;
  --critical-soft: rgba(201,48,44,0.10);
  --muted-status: #9a988f;
  --shadow: 0 1px 2px rgba(0,0,0,.04);
  --shadow-lg: 0 10px 30px -12px rgba(0,0,0,.28);
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .viz-root {
    color-scheme: dark;
    --page: #0d0d0d; --surface-1: #181817; --surface-2: #222220; --text-primary: #f0efec; --text-secondary: #c3c2b7;
    --text-muted: #96948d; --grid: #2a2a28; --baseline: #3a3a37; --border: rgba(255,255,255,0.09);
    --border-strong: rgba(255,255,255,0.16); --hover: rgba(255,255,255,0.05); --select: rgba(57,135,229,0.18);
    --accent: #f07a45; --accent-soft: rgba(240,122,69,0.14);
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
    --seq: #3987e5; --seq-track: #2a2a28; --good: #2fb344; --critical: #ef6461; --critical-soft: rgba(239,100,97,0.14);
    --muted-status: #6f6d67; --shadow: 0 1px 2px rgba(0,0,0,.4); --shadow-lg: 0 12px 32px -12px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"] .viz-root {
  color-scheme: dark;
  --page: #0d0d0d; --surface-1: #181817; --surface-2: #222220; --text-primary: #f0efec; --text-secondary: #c3c2b7;
  --text-muted: #96948d; --grid: #2a2a28; --baseline: #3a3a37; --border: rgba(255,255,255,0.09);
  --border-strong: rgba(255,255,255,0.16); --hover: rgba(255,255,255,0.05); --select: rgba(57,135,229,0.18);
  --accent: #f07a45; --accent-soft: rgba(240,122,69,0.14);
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
  --seq: #3987e5; --seq-track: #2a2a28; --good: #2fb344; --critical: #ef6461; --critical-soft: rgba(239,100,97,0.14);
  --muted-status: #6f6d67; --shadow: 0 1px 2px rgba(0,0,0,.4); --shadow-lg: 0 12px 32px -12px rgba(0,0,0,.7);
}

/* ---------------------------------------------------------------- base */
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; -webkit-font-smoothing: antialiased; }
.viz-root { background: var(--page); color: var(--text-primary); min-height: 100vh; }
.num { font-variant-numeric: tabular-nums; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; text-underline-offset: 3px; }
code, .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12px; }
button, select, input, textarea { font: inherit; color: var(--text-primary); }
button, select, input[type=text], input[type=number], input[type=search], textarea {
  background: var(--surface-1); border: 1px solid var(--border-strong); border-radius: 7px; }
button { padding: 5px 12px; cursor: pointer; font-weight: 500; white-space: nowrap; }
button:hover { background: var(--hover); }
button.primary { background: var(--text-primary); color: var(--surface-1); border-color: transparent; }
button.primary:hover { opacity: .88; }
button.danger { color: var(--critical); }
button.danger.primary { background: var(--critical); color: #fff; }
button.ghost { border-color: transparent; background: transparent; color: var(--text-secondary); padding: 4px 8px; }
button.ghost:hover { background: var(--hover); color: var(--text-primary); }
button.sm, select.sm { font-size: 12px; padding: 3px 8px; }
button.icon { width: 32px; height: 32px; padding: 0; display: inline-flex; align-items: center; justify-content: center; color: var(--text-secondary); }
button.icon:hover { color: var(--text-primary); }
button.icon svg { width: 16px; height: 16px; }
button.icon.spin svg { animation: spin .7s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
select { padding: 5px 8px; cursor: pointer; }
input[type=text], input[type=number], input[type=search], textarea { padding: 6px 10px; }
input::placeholder, textarea::placeholder { color: var(--text-muted); }
:focus-visible { outline: 2px solid var(--seq); outline-offset: 2px; border-radius: 6px; }
.muted { color: var(--text-muted); }
.crit { color: var(--critical); font-weight: 600; }
.hide { display: none !important; }

/* ---------------------------------------------------------------- header */
header { display: flex; align-items: center; gap: 12px 18px; padding: 10px 24px; border-bottom: 1px solid var(--border);
  background: color-mix(in srgb, var(--surface-1) 92%, transparent); backdrop-filter: blur(8px);
  position: sticky; top: 0; z-index: 10; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font-weight: 700; font-size: 16px; letter-spacing: -.01em; margin: 0; }
.brand .logo { flex: none; border-radius: 7px; }
.brand .ver { font-size: 11px; font-weight: 500; color: var(--text-muted); border: 1px solid var(--border); border-radius: 999px; padding: 1px 7px; letter-spacing: 0; }
nav.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; }
nav.tabs a { color: var(--text-secondary); text-decoration: none; padding: 6px 12px; border-radius: 7px; font-weight: 550; white-space: nowrap; }
nav.tabs a:hover { background: var(--hover); color: var(--text-primary); }
nav.tabs a.on { background: var(--surface-2); color: var(--text-primary); box-shadow: inset 0 0 0 1px var(--border); }
header .spacer { flex: 1; }
header .controls { display: flex; align-items: center; gap: 8px; }
.status { display: inline-flex; align-items: center; gap: 6px; color: var(--text-muted); font-size: 12px; white-space: nowrap; }
.status .dot { margin: 0; }
.status.off { color: var(--critical); }
.status.off .dot { background: var(--critical); }
@media (max-width: 900px) {
  header { padding: 10px 16px; }
  nav.tabs { order: 3; width: 100%; }
  header .status { display: none; }
}
/* phones: the filter row spans the full width, the select takes what the icons leave */
@media (max-width: 640px) {
  header .controls { width: 100%; }
  header .controls select { flex: 1; min-width: 0; }
  .toolbar select { flex: 1; min-width: 0; }
  .toolbar #sindex { width: 100%; }
}

/* ---------------------------------------------------------------- layout */
.wrap { padding: 20px 24px 40px; max-width: 1600px; margin: 0 auto; }
@media (max-width: 900px) { .wrap { padding: 16px; } }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); }
.view > .card + .card { margin-top: 20px; }
/* one inset everywhere: 20px from the card edge to the text */
.card-head { display: flex; align-items: center; gap: 10px; padding: 14px 20px 10px; flex-wrap: wrap; }
.card-head h2 { font-size: 13px; font-weight: 650; margin: 0; color: var(--text-primary); }
.card-head .count { color: var(--text-muted); font-size: 12px; }
.card-head .grow { flex: 1; }
.section { padding: 6px 20px 20px; }
.section-title { font-size: 12px; font-weight: 650; color: var(--text-secondary); margin: 0; padding: 14px 0 10px; letter-spacing: .02em; }
.empty { color: var(--text-muted); padding: 40px 24px; text-align: center; }
.empty b { color: var(--text-secondary); }
.note { color: var(--text-muted); font-size: 12px; padding: 0 20px 18px; }
.view { display: none; }
.view.on { display: block; }

/* ---------------------------------------------------------------- tasks */
.tasks-layout { display: grid; grid-template-columns: minmax(300px, 380px) minmax(0, 1fr); gap: 20px; align-items: start; }
@media (max-width: 1000px) { .tasks-layout { grid-template-columns: minmax(0, 1fr); } }
.tasklist { position: sticky; top: 74px; max-height: calc(100vh - 94px); display: flex; flex-direction: column; }
@media (max-width: 1000px) { .tasklist { position: static; max-height: 46vh; } }
.tasklist .filters { display: flex; gap: 6px; padding: 0 20px 12px; }
.tasklist .filters input { flex: 1; min-width: 0; }
.tasklist #tasks { overflow: auto; border-top: 1px solid var(--border); }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: 7px; overflow: hidden; }
.seg button { border: 0; border-radius: 0; padding: 5px 10px; font-size: 12px; color: var(--text-secondary); }
.seg button + button { border-left: 1px solid var(--border-strong); }
.seg button.on { background: var(--surface-2); color: var(--text-primary); font-weight: 600; }
.trow { display: grid; grid-template-columns: 12px minmax(0, 1fr) auto; gap: 3px 10px; padding: 11px 20px; cursor: pointer;
  border-bottom: 1px solid var(--border); }
.trow:hover { background: var(--hover); }
.trow.sel { background: var(--select); }
.trow .name { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trow .tok { text-align: right; font-weight: 650; }
.trow .meta { grid-column: 2 / 4; color: var(--text-muted); font-size: 12px; display: flex; gap: 6px 10px; flex-wrap: wrap; align-items: center; }
.dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 6px; background: var(--muted-status); flex: none; }
.dot.active { background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 22%, transparent); }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 2px 9px;
  border-radius: 999px; border: 1px solid var(--border); color: var(--text-secondary); background: var(--surface-1); }
.badge .dot { margin: 0; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; padding: 1px 8px; border-radius: 999px;
  border: 1px solid var(--border); color: var(--text-secondary); background: var(--surface-2); white-space: nowrap; }
a.chip:hover { text-decoration: none; border-color: var(--border-strong); color: var(--text-primary); }
.chip.warn { color: var(--critical); background: var(--critical-soft); border-color: transparent; font-weight: 600; }
.chip.accent { color: var(--accent); background: var(--accent-soft); border-color: transparent; }
#detail { min-width: 0; }
.dhead { padding: 18px 20px 4px; }
.dhead .top { display: flex; align-items: flex-start; gap: 4px 12px; flex-wrap: wrap; }
/* the title keeps at least 260px; below that the buttons move under it */
.dhead h2 { font-size: 20px; margin: 0 0 8px; font-weight: 650; line-height: 1.25; overflow-wrap: anywhere; flex: 1 1 260px; }
.dhead .actions { display: flex; gap: 6px; flex: none; flex-wrap: wrap; margin-bottom: 8px; }
.dhead .line { color: var(--text-secondary); font-size: 13px; display: flex; gap: 8px 12px; flex-wrap: wrap; align-items: center; }
.dhead .path { color: var(--text-muted); font-size: 12px; margin-top: 6px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dhead .rename { display: flex; gap: 6px; flex: 1; margin-bottom: 8px; }
.dhead .rename input { flex: 1; font-size: 16px; font-weight: 600; }
.confirm { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; color: var(--text-secondary); }
.prompt { margin: 12px 20px 0; padding: 10px 14px; border-left: 3px solid var(--accent); background: var(--surface-2); border-radius: 0 8px 8px 0;
  color: var(--text-secondary); white-space: pre-wrap; max-height: 132px; overflow: auto; font-size: 13px; }
/* flex, not grid: a wrapped last row stretches instead of leaving an empty grey cell */
.tiles { display: flex; flex-wrap: wrap; gap: 1px; background: var(--border);
  border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); margin-top: 16px; }
.tile { flex: 1 1 140px; min-width: 0; background: var(--surface-1); padding: 14px 20px; }
.tile .label { color: var(--text-secondary); font-size: 12px; }
.tile .value { font-size: 24px; font-weight: 650; margin-top: 2px; letter-spacing: -.01em; }
.tile .hint { color: var(--text-muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stack { display: flex; height: 14px; gap: 2px; border-radius: 4px; overflow: hidden; background: var(--surface-1); }
.stack div { height: 100%; min-width: 2px; cursor: default; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 10px; font-size: 13px; }
.legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.legend .v { font-weight: 600; margin-left: 4px; }
.legend .p { color: var(--text-muted); margin-left: 4px; }
.tscroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: right; font-weight: 600; color: var(--text-muted); font-size: 12px; padding: 7px 8px; border-bottom: 1px solid var(--baseline); white-space: nowrap; }
td { text-align: right; padding: 7px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
/* hover and selection highlight whole rows: the edge cells keep 10px inside the row,
   and the table reaches 10px into the section's padding, so the text stays aligned
   with the section titles */
th:first-child, td:first-child { text-align: left; padding-left: 10px; }
th:last-child, td:last-child { padding-right: 10px; }
.section .tscroll, .section > table, .section > div > table { margin-left: -10px; margin-right: -10px; width: calc(100% + 20px); }
.section .tscroll > table { width: 100%; margin: 0; }
td.lbl { white-space: normal; max-width: 0; width: 42%; }
td.lbl .t { display: flex; align-items: center; gap: 6px; min-width: 0; }
td.lbl .t span.txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
tr.tot td { font-weight: 650; border-top: 1px solid var(--baseline); border-bottom: none; }
tbody tr:hover td { background: var(--hover); }
.kind { font-size: 11px; color: var(--text-muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; flex: none; }
.tw { width: 18px; height: 18px; flex: none; color: var(--text-muted); cursor: pointer; user-select: none; text-align: center; border: 0; background: none; padding: 0; line-height: 18px; }
.tw:hover { color: var(--text-primary); }
.share { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
.share .track { width: 110px; height: 8px; background: var(--seq-track); border-radius: 4px; overflow: hidden; }
.share .bar { height: 100%; background: var(--seq); border-radius: 0 4px 4px 0; }
.share .pc { width: 44px; color: var(--text-secondary); }
.two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 0 28px; }
@media (max-width: 1200px) { .two { grid-template-columns: minmax(0, 1fr); } }
.prompts { padding-left: 20px; margin: 0; }
.prompts li { margin: 0 0 8px; color: var(--text-secondary); white-space: pre-wrap; overflow-wrap: anywhere; }
.prompts time { color: var(--text-muted); font-size: 12px; margin-right: 8px; }
.ptable td.ptxt { white-space: normal; max-width: 0; width: 38%; color: var(--text-secondary); text-align: left; }
.ptable th:nth-child(2) { text-align: left; }
.ptable td.ptxt span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
#tip { position: fixed; pointer-events: none; z-index: 30; background: var(--surface-1); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: var(--shadow-lg);
  display: none; max-width: 320px; }
#tip b { display: block; margin-bottom: 2px; }

/* ---------------------------------------------------------------- getting started */
.tasks-layout.solo { grid-template-columns: minmax(0, 1fr); }
.hero { padding: 28px 28px 24px; }
.hero h2 { font-size: 22px; margin: 0 0 6px; letter-spacing: -.01em; }
.hero p { color: var(--text-secondary); margin: 0 0 18px; max-width: 760px; }
.cmds { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; margin-bottom: 22px; }
@media (max-width: 760px) { .cmds { grid-template-columns: minmax(0, 1fr); } }
.cmd { border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; background: var(--surface-2); }
.cmd .who { font-size: 12px; color: var(--text-muted); margin-bottom: 4px; }
.cmd code { font-size: 13px; color: var(--text-primary); }
.hero .ctas { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 18px; }
.hero .ctas a { display: inline-flex; align-items: center; padding: 6px 14px; border-radius: 7px; border: 1px solid var(--border-strong); color: var(--text-primary); font-weight: 500; }
.hero .ctas a.primary { background: var(--text-primary); color: var(--surface-1); border-color: transparent; }
.hero .ctas a:hover { text-decoration: none; background: var(--hover); }
.hero .ctas a.primary:hover { background: var(--text-primary); opacity: .88; }
.hero .tiles { margin: 0 -28px; }
.banner { border: 1px dashed var(--border-strong); border-radius: 12px; padding: 16px 18px; margin-bottom: 14px; color: var(--text-secondary); }
.banner b { color: var(--text-primary); }
.banner code { background: var(--surface-2); border-radius: 4px; padding: 0 4px; }

/* ---------------------------------------------------------------- todos */
.addbar { display: flex; gap: 8px; margin-bottom: 6px; }
.addbar input { flex: 1; min-width: 0; padding: 9px 12px; border-radius: 9px; }
.addhint { color: var(--text-muted); font-size: 12px; margin: 0 2px 16px; }
.addhint code { background: var(--surface-2); border-radius: 4px; padding: 0 4px; }
.board { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; align-items: start; }
@media (max-width: 1100px) { .board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 640px) { .board { grid-template-columns: minmax(0, 1fr); } }
.col { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 10px; min-height: 120px; }
.col h3 { font-size: 12px; margin: 2px 4px 10px; color: var(--text-secondary); display: flex; justify-content: space-between; align-items: center; }
.col .empty { padding: 18px; font-size: 12px; }
.tcard { border: 1px solid var(--border); border-radius: 9px; padding: 10px 11px; margin-bottom: 8px; background: var(--page); }
.tcard.dropped .ttl { text-decoration: line-through; color: var(--text-muted); }
.tcard .ttl { font-weight: 600; overflow-wrap: anywhere; }
.tcard .ttl .prio { color: var(--accent); font-weight: 700; margin-right: 2px; }
.tcard .row { display: flex; gap: 6px 8px; flex-wrap: wrap; align-items: center; margin-top: 7px; font-size: 12px; color: var(--text-muted); }
.tcard .row .grow { flex: 1; }
.tcard details { margin-top: 7px; font-size: 13px; }
.tcard summary { cursor: pointer; color: var(--text-secondary); font-size: 12px; }
.tcard .steps { list-style: none; padding: 4px 0 0; margin: 0; }
.tcard .steps li { display: flex; gap: 6px; align-items: flex-start; padding: 2px 0; }
.tcard .steps li.done span { color: var(--text-muted); text-decoration: line-through; }
.tcard form { display: grid; gap: 6px; margin-top: 8px; }
.tcard form .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.tcard form label { font-size: 11px; color: var(--text-muted); display: grid; gap: 2px; }
.tcard form input, .tcard form select, .tcard form textarea { font-size: 13px; width: 100%; }
.tcard form .btns { display: flex; gap: 6px; align-items: center; margin-top: 2px; }
.prog { display: flex; align-items: center; gap: 6px; }
.prog .track { width: 80px; height: 6px; background: var(--seq-track); border-radius: 3px; overflow: hidden; }
.prog .bar { height: 100%; background: var(--seq); }

/* ---------------------------------------------------------------- projects, sessions, settings */
#projtable { max-height: 46vh; overflow: auto; }
.ptbl th.pname { width: 30%; }
.ptbl th.c-track, .ptbl td.c-track { text-align: left; width: 1%; }
.ptbl th:last-child, .ptbl td:last-child { padding-right: 14px; }
.ptbl thead th { position: sticky; top: 0; background: var(--surface-1); z-index: 1; }
.ptbl tbody tr { cursor: pointer; }
.ptbl tbody tr.sel td { background: var(--select); }
.chart { display: block; width: 100%; }
.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
#stable { max-height: 60vh; overflow: auto; }
.stbl thead th { position: sticky; top: 0; background: var(--surface-1); z-index: 1; }
.stbl td.ttl { white-space: normal; max-width: 0; width: 28%; }
.stbl td.ttl span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stbl th:nth-child(-n+4), .stbl td:nth-child(-n+4), .stbl th:last-child, .stbl td:last-child { text-align: left; }
.stbl th:first-child, .stbl td:first-child { padding-left: 20px; }

/* ---------------------------------------------------------------- menus, scope bar */

<body>
<div class="viz-root">
  <header>

      <rect x="0.5" y="0.5" width="63" height="63" rx="14.5" fill="none" stroke="#fff" stroke-opacity=".10"/>
      <path d="M21 16v32M28.5 16v32M36 16v32M43.5 16v32" stroke="#f3f2ee" stroke-width="4.6" stroke-linecap="round"/>

<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => Array.from(el.querySelectorAll(s));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtTok = n => n == null ? "–" : n < 1e3 ? String(n) : n < 1e6 ? (n/1e3).toFixed(1) + "k" : n < 1e9 ? (n/1e6).toFixed(2) + "M" : (n/1e9).toFixed(2) + "B";
const fmtFull = n => (n ?? 0).toLocaleString("en-US");
const fmtCost = (c, partial) => c == null ? "–" : (c >= 999.5 ? "$" + Math.round(c).toLocaleString("en-US") : c >= 0.995 || c === 0 ? "$" + c.toFixed(2) : "$" + c.toFixed(3)) + (partial ? "+" : "");
function fmtDur(s) {
  if (s == null) return "–";
  s = Math.round(s);
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s/60) + "m " + String(s%60).padStart(2,"0") + "s";
  if (s < 86400) return Math.floor(s/3600) + "h " + String(Math.floor(s%3600/60)).padStart(2,"0") + "m";
  return Math.floor(s/86400) + "d " + String(Math.floor(s%86400/3600)).padStart(2,"0") + "h";
}
// one format for the whole page, whatever the browser's locale: "7 Oct", "Wed 14 Oct", "07:30"
const MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
const DAYS = ["Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"];
const DATE = {format: d => d.getDate() + " " + MONTHS[d.getMonth()]};
const WDAY = {format: d => DAYS[d.getDay()] + " " + DATE.format(d)};
const TIME = {format: d => String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0")};
const sameDay = (a, b) => a.toDateString() === b.toDateString();
function fmtWhen(ts) {
  if (!ts) return "–";
  const d = new Date(ts * 1000), now = new Date();
  const day = sameDay(d, now) ? "Today" : sameDay(d, new Date(now - 864e5)) ? "Yesterday" : DATE.format(d);
  return day + ", " + TIME.format(d);
}
function fmtAgo(ts) {
  if (!ts) return "–";
  const s = Date.now() / 1000 - ts;
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + " min ago";
  if (s < 86400) return Math.floor(s / 3600) + " h ago";
  return fmtWhen(ts);
}
const pct = (a, b) => b ? (a / b * 100) : 0;
const plural = (n, w) => n + " " + w + (n === 1 ? "" : "s");
const shortModel = m => String(m || "").replace(/^claude-/, "").split("/").pop();

// ---------------------------------------------------------------- feedback
function toast(msg, err) {
  const el = document.createElement("div");
  el.className = "toast" + (err ? " err" : "");
  el.textContent = msg;
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), err ? 6000 : 2600);
}
function online(ok) {
  $("#status").classList.toggle("off", !ok);
  $("#status .dot").classList.toggle("active", ok);
  $("#updated").textContent = ok ? "updated " + TIME.format(new Date()) : "dashboard server not reachable";
}
async function getJSON(url) {
  let r;
  try { r = await fetch(url, {cache: "no-store"}); }
  catch (e) { online(false); throw new Error("The dashboard server is not running. Start it with /tally:dashboard or tally dashboard."); }
  if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || r.status + " " + url);
  online(true);
  return r.json();
}
async function postJSON(url, body) {
  let r;
  try { r = await fetch(url, {method: "POST", headers: {"Content-Type": "application/json", "X-Tally": "1"}, body: JSON.stringify(body)}); }
  catch (e) { online(false); throw new Error("Not saved: the dashboard server is not reachable."); }
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || "request failed (" + r.status + ")");
  return d;
}
const guard = p => p.catch(e => toast(e.message || String(e), true));

// ---------------------------------------------------------------- export menus and copy
const ICON_DL = '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"/></svg>';
const ICON_COPY = '<svg class="i" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
const EXT = {csv: ".csv", md: ".md", json: ".json", text: ".txt"};
const exportUrl = q => "/api/export?" + new URLSearchParams(Object.entries(q).filter(([, v]) => v !== null && v !== undefined && v !== ""));
let menuSeq = 0;
// groups: [[title or null, [[label, query, "copy"?], ...]], ...]
function menu(groups, opts) {
  opts = opts || {};
  const id = "menu" + (++menuSeq);
  const items = groups.map(([title, list]) => (title ? `<div class="grp">${esc(title)}</div>` : "") + list.map(([label, q, kind]) =>
    kind === "copy"
      ? `<button type="button" role="menuitem" data-copy="${esc(exportUrl(q))}">${esc(label)}<span class="ext">copy</span></button>`
      : `<a role="menuitem" href="${esc(exportUrl(Object.assign({}, q, {download: 1})))}" download>${esc(label)}<span class="ext">${EXT[q.format]}</span></a>`).join("")).join("");
  const button = opts.icon
    ? `<button type="button" class="icon" data-menu="${id}" aria-haspopup="menu" aria-expanded="false" title="${esc(opts.title || "Export")}" aria-label="${esc(opts.title || "Export")}">${ICON_DL.replace('class="i" ', "")}</button>`
    : `<button type="button" class="sm" data-menu="${id}" aria-haspopup="menu" aria-expanded="false">${ICON_DL}${esc(opts.label || "Export")}</button>`;
  return `<span class="menu-wrap">${button}<div class="menu hide" role="menu" id="${id}">${items}</div></span>`;
}
function closeMenus() { $$(".menu").forEach(m => m.classList.add("hide")); $$("[data-menu]").forEach(b => b.setAttribute("aria-expanded", "false")); }
document.addEventListener("click", e => {
  const b = e.target.closest("[data-menu]");
  if (b) {
    const m = document.getElementById(b.dataset.menu), was = !m.classList.contains("hide");
    closeMenus();
    if (!was) {
      m.style.left = m.style.right = "";
      m.classList.remove("hide");
      b.setAttribute("aria-expanded", "true");
      const r = m.getBoundingClientRect();            // keep it on screen: open to the right if needed
      if (r.left < 8) { m.style.right = "auto"; m.style.left = "0"; }
    }
    return;
  }
  const c = e.target.closest("[data-copy]");
  if (c) copyFrom(c.dataset.copy);
  if (!e.target.closest(".menu") || c || e.target.closest(".menu a")) closeMenus();
});
document.addEventListener("keydown", e => { if (e.key === "Escape") closeMenus(); });
async function copyText(text) {
  if (navigator.clipboard && window.isSecureContext) return navigator.clipboard.writeText(text);
  const ta = document.createElement("textarea");
  ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
  document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
}
async function copyFrom(url) {
  try {
    const r = await fetch(url, {cache: "no-store"});
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).error || "export failed (" + r.status + ")");
    await copyText(await r.text());

}
function renderGlobalExport() {
  const groups = [
    ["Everything · last 30 days", [["Summary (Markdown)", {scope: "summary", format: "md", days: 30}], ["Summary (CSV)", {scope: "summary", format: "csv", days: 30}],
      ["Summary (JSON)", {scope: "summary", format: "json", days: 30}], ["Copy summary as Markdown", {scope: "summary", format: "md", days: 30}, "copy"]]],

  $("#gexport").innerHTML = menu(groups, {icon: true, title: "Export"});
}

// ---------------------------------------------------------------- theme
// one icon button: auto (follow the system) → light → dark
const THEMES = {
  "": ["Auto, follows the system", '<rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/>'],
  light: ["Light", '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/>'],
  dark: ["Dark", '<path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9z"/>'],

let theme = localStorage.getItem("tc-theme") || "";

applyTheme();

// ---------------------------------------------------------------- tooltip
const tip = $("#tip");
document.addEventListener("mousemove", e => {
  const t = e.target.closest("[data-tip]");
  if (!t) { tip.style.display = "none"; return; }
  tip.innerHTML = t.getAttribute("data-tip");
  tip.style.display = "block";
  const r = tip.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 14;
  tip.style.left = x + "px"; tip.style.top = y + "px";
});

// ---------------------------------------------------------------- state
function parseHash() {
  const h = location.hash.slice(1);
  if (/^\d+$/.test(h)) return {view: "tasks", id: Number(h)};
  const [v, id] = h.split("/");
  if (v === "sessions") return {view: v, id: null, sid: id ? decodeURIComponent(id) : null};
  if (v === "projects") return {view: v, id: null, pname: id ? decodeURIComponent(h.slice("projects/".length)) : null};

let view = parseHash().view;
let selected = parseHash().id;
let tasks = [];
let taskFilter = {q: "", st: ""};
let project = localStorage.getItem("tc-project") || "";
const collapsed = new Set();
const seenKeys = new Set();       // nodes with many children start collapsed

function setView(v) {
  view = v;
  $$(".view").forEach(el => el.classList.toggle("on", el.id === "view-" + v));
  renderScope();
  closeMenus();
  $$("nav.tabs a").forEach(a => { a.classList.toggle("on", a.dataset.view === v); a.toggleAttribute("aria-current", a.dataset.view === v); });
  if (v === "todos") guard(loadTodos());
  if (v === "settings") guard(loadSettings());
  if (v === "projects") guard(loadProjectsView());
  if (v === "sessions") guard(loadSessions());
  if (v === "tasks") refreshAll();
}
async function loadProjects() {
  const d = await getJSON("/api/projects");
  const sel = $("#project");
  sel.innerHTML = '<option value="">All projects</option>' + d.projects.map(p =>
    `<option value="${esc(p.project)}">${esc(p.project)}${p.open_todos ? " · " + p.open_todos + " open" : ""}</option>`).join("");
  sel.value = d.projects.some(p => p.project === project) ? project : "";
}
function setProject(name) {
  project = name || "";
  localStorage.setItem("tc-project", project);
  $("#project").value = project;
  selected = null;
  renderGlobalExport();
}
$("#project").onchange = e => { setProject(e.target.value); setView(view); };
// a visible heading whenever a view shows one project only
function renderScope() {
  const show = project && ["tasks", "todos", "sessions"].includes(view);
  $("#scopebar").classList.toggle("hide", !show);
  $$(".view").forEach(el => el.classList.toggle("scoped", !!show));
  if (!show) return;
  $("#scopebar").innerHTML = `<div class="bar"><span class="lbl">${{tasks: "Tasks of project", todos: "Todos of project", sessions: "Sessions of project"}[view]}</span>
    <b>${esc(project)}</b><a href="#projects/${encodeURIComponent(project)}">Project details →</a><span class="grow"></span>
    <button type="button" class="sm" data-clear-project>✕ All projects</button></div>`;
  $("[data-clear-project]").onclick = () => { setProject(""); setView(view); };
}

// ---------------------------------------------------------------- tasks
async function loadTasks() {
  const d = await getJSON("/api/tasks?limit=500" + (project ? "&project=" + encodeURIComponent(project) : ""));
  tasks = d.tasks;
  if (!selected && tasks.length) selected = tasks[0].id;
  renderTasks();
}
$("#tsearch").oninput = e => { taskFilter.q = e.target.value.trim().toLowerCase(); renderTasks(); };
$$(".tasklist .seg button").forEach(b => b.onclick = () => {
  taskFilter.st = b.dataset.st;
  $$(".tasklist .seg button").forEach(x => x.classList.toggle("on", x === b));
  renderTasks();
});
function renderTasks() {
  const el = $("#tasks");
  const shown = tasks.filter(t => (!taskFilter.st || t.status === taskFilter.st) &&
    (!taskFilter.q || (("#" + t.id + " " + t.name).toLowerCase().includes(taskFilter.q))));
  const active = tasks.filter(t => t.status === "active").length;
  $("#texport").innerHTML = tasks.length ? menu([
    [null, [["Time sheet (CSV)", {scope: "tasks", project, format: "csv"}], ["Markdown table", {scope: "tasks", project, format: "md"}],
      ["JSON, full reports", {scope: "tasks", project, format: "json"}]]],
    ["Copy", [["One line per task", {scope: "tasks", project, format: "text"}, "copy"], ["Markdown table", {scope: "tasks", project, format: "md"}, "copy"]]],
  ]) : "";
  $("#taskcount").textContent = tasks.length ? plural(tasks.length, "task") + (active ? " · " + active + " active" : "") : "";
  $(".tasks-layout").classList.toggle("solo", !tasks.length);
  $(".tasklist").classList.toggle("hide", !tasks.length);
  if (!tasks.length) { renderWelcome(); return; }
  if (!shown.length) { el.innerHTML = '<div class="empty">No task matches the filter.</div>'; return; }
  el.innerHTML = shown.map(t => `
    <div class="trow ${t.id === selected ? "sel" : ""}" data-id="${t.id}" role="button" tabindex="0" aria-label="task ${t.id}: ${esc(t.name)}">
      <span class="dot ${t.status === "active" ? "active" : ""}" title="${t.status}"></span>
      <span class="name" title="${esc(t.name)}">${esc(t.name)}</span>
      <span class="tok num">${fmtTok(t.total)}</span>
      <span class="meta num"><span>#${t.id}</span>${t.project && !project ? `<span class="chip">${esc(t.project)}</span>` : ""}
        <span title="${esc(fmtWhen(t.started_at))}">${t.status === "active" ? "running · " + fmtDur(t.wall_s) : fmtAgo(t.ended_at || t.started_at)}</span>
        <span>${fmtCost(t.cost, t.cost_partial)}</span>${t.todo_id ? `<span class="chip">todo #${t.todo_id}</span>` : ""}</span>
    </div>`).join("");
  $$(".trow", el).forEach(r => {
    const go = () => { selected = Number(r.dataset.id); history.replaceState(null, "", "#tasks/" + selected); renderTasks(); guard(loadDetail()); };
    r.onclick = go; r.onkeydown = e => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); go(); } };
  });
}
// no tasks yet: say what a task is, how to start one, and what the agents already used
async function renderWelcome() {
  const el = $("#detail");
  const where = project ? ` in <b>${esc(project)}</b>` : "";
  el.innerHTML = `<div class="hero"><h2>Measure your first task${where}</h2>
    <p>A task counts the tokens, cost and time of everything an agent does until you end it: the main conversation, its subagents and workflows. Start one in your agent, work as usual, and the report appears here.</p>
    <div class="cmds">
      <div class="cmd"><div class="who">Claude Code</div><code>/tally:start Fix login bug</code></div>
      <div class="cmd"><div class="who">Codex</div><code>tally:start Fix login bug</code></div>
      <div class="cmd"><div class="who">pi</div><code>/tally start Fix login bug</code></div>
    </div><div id="welcome-usage"></div>
    <div class="ctas"><a class="primary" href="#sessions">Open Sessions</a><a href="#todos">Plan with todos</a><a href="#settings">Settings</a></div></div>`;
  try {
    const d = await getJSON("/api/sessions?" + new URLSearchParams({days: "30", project, limit: "1"}));
    const t = d.totals;
    if (!t.sessions) return;
    $("#welcome-usage").innerHTML = `<div class="section-title" style="padding-top:4px">Meanwhile, your agents in the last 30 days${where}</div><div class="tiles">
      ${tile("Sessions", fmtFull(t.sessions), d.by_agent.map(a => (AGENTS[a.agent] || a.agent) + " " + a.sessions).join(" · "))}
      ${tile("Tokens", fmtTok(t.total), fmtTok(t.output) + " output")}
      ${tile("Est. cost", fmtCost(t.cost), "at API list price")}
      ${tile("Prompts", fmtFull(t.prompts), fmtFull(t.calls) + " API calls")}
      ${tile("Active time", fmtDur(t.active_s), "time agents were working")}</div>`;
  } catch (e) { /* the welcome works without numbers */ }
}

async function loadDetail() {
  if (!tasks.length) return;
  if (!selected) { $("#detail").innerHTML = '<div class="empty">Select a task.</div>'; return; }
  try {
    renderDetail(await getJSON("/api/tasks/" + selected));
  } catch (e) {
    $("#detail").innerHTML = `<div class="empty">Task #${selected} was not found.</div>`;
  }
}

function tile(label, value, hint, tipText) {
  return `<div class="tile"${tipText ? ` data-tip="${esc(tipText)}"` : ""}><div class="label">${label}</div>
    <div class="value num">${value}</div><div class="hint num">${hint || "&nbsp;"}</div></div>`;
}

function taskActions(t) {
  const q = f => ({scope: "task", ref: t.id, format: f});
  const out = `<button class="sm" type="button" data-copy="${esc(exportUrl(q("text")))}" title="one line for your time tracker: name, project, time, tokens, cost">${ICON_COPY}Copy</button>` +
    menu([[null, [["Report (Markdown)", q("md")], ["Time sheet row (CSV)", q("csv")], ["JSON", q("json")]]],
          ["Copy", [["Report as Markdown", q("md"), "copy"]]]]);
  if (t.status === "active") return out + `<button class="sm" data-act="rename">Rename</button><button class="sm" data-act="end">End task</button>`;
  return out + `<button class="sm" data-act="rename">Rename</button><button class="sm danger" data-act="delete">Delete</button>`;
}

function renderDetail(rep, target) {
  const el = target || $("#detail");
  const t = rep.task, tm = rep.time, tot = rep.totals, sess = rep.session;
  const active = t.status === "active";
  const agents = rep.by_type.filter(x => x.agent_type !== "main").reduce((a, x) => a + x.agents, 0);
  const un = rep.unlogged || {};
  const unCost = (un.status === "estimated" || un.status === "partial") && un.cost ? un.cost : 0;
  const comp = [
    ["Input", tot.input, "--series-1", "uncached input tokens"],
    ["Output", tot.output, "--series-2", "generated tokens (incl. thinking)"],
    ["Cache write", tot.cache_write, "--series-3", "tokens written to the prompt cache"],
    ["Cache read", tot.cache_read, "--series-4", "tokens served from the prompt cache"],
  ];
  const h = [];
  if (sess) h.push(`<div class="dhead"><div class="top"><h2>${esc(sess.title || "Session " + sess.session_id)}</h2>
      ${target ? `<div class="actions"><button class="sm" type="button" data-copy="${esc(exportUrl({scope: "session", ref: sess.session_id, format: "text"}))}" title="one line: title, agent, project, time, tokens, cost">${ICON_COPY}Copy</button>${
        menu([[null, [["Report (Markdown)", {scope: "session", ref: sess.session_id, format: "md"}], ["JSON", {scope: "session", ref: sess.session_id, format: "json"}]]],
              ["Copy", [["Report as Markdown", {scope: "session", ref: sess.session_id, format: "md"}, "copy"]]]])}<button class="ghost sm" data-close aria-label="Close">✕ Close</button></div>` : ""}</div>
    <div class="line"><span class="badge">${esc(AGENTS[sess.agent] || sess.agent)}</span>
    <span class="num">${fmtWhen(t.started_at)} → ${fmtWhen(t.ended_at)}</span>
    ${sess.project ? `<span class="chip">${esc(sess.project)}</span>` : ""}</div>
    <div class="path" title="${esc((sess.cwd || "") + " · " + sess.session_id)}">${sess.cwd ? esc(sess.cwd) + " · " : ""}<span class="mono">${esc(sess.session_id)}</span></div></div>`);
  else h.push(`<div class="dhead"><div class="top" id="dtop"><h2>${esc(t.name)} <span class="muted num" style="font-weight:500">#${t.id}</span></h2>
      <div class="actions" id="dactions">${taskActions(t)}</div></div>
    <div class="line"><span class="badge"><span class="dot ${active ? "active" : ""}"></span>${active ? "active" : "ended"}</span>
    <span class="num">${fmtWhen(t.started_at)}${t.ended_at ? " → " + fmtWhen(t.ended_at) : ""}</span>
    ${t.project ? `<span class="chip">${esc(t.project)}</span>` : ""}
    ${t.todo ? `<a class="chip accent" href="#todos" title="the todo this task measures">todo #${t.todo.id} · ${esc(t.todo.status)}</a>` : ""}
    <span class="muted">${plural(t.sessions.length, "session")} · ${plural(t.prompt_count, "prompt")}</span></div>
    ${t.cwd ? `<div class="path" title="${esc(t.cwd)}">${esc(t.cwd)}</div>` : ""}</div>`);
  if (t.initial_prompt) h.push(`<div class="prompt">${esc(t.initial_prompt)}</div>`);
  h.push(`<div class="tiles">
    ${tile("Total tokens", fmtTok(tot.total), fmtFull(tot.total), "input + output + cache write + cache read")}
    ${tile("Output tokens", fmtTok(tot.output), fmtFull(tot.output))}
    ${tile("Est. cost", fmtCost(tot.cost + unCost, tot.cost_partial), unCost ? "incl. ≈ " + fmtCost(unCost) + " unlogged" : "at API list price", "Estimate from token counts and list prices; subscription plans are not billed per token." + (unCost ? " Includes Claude Code's own calls that are not in the transcripts, estimated from its session cost record." : ""))}
    ${tile("Wall time", fmtDur(tm.wall_s), active ? "running" : "start → end")}
    ${tile("Active time", fmtDur(tm.active_s), plural(tm.turns, "turn"), "time the agent was working on turns")}
    ${tile("API calls", fmtFull(tot.calls), agents ? plural(agents, "agent") : "main session only")}
  </div>`);

  if (tot.total) {
    h.push(`<div class="section"><div class="section-title">Token composition</div>
      <div class="stack" role="img" aria-label="Token composition">${comp.filter(c => c[1] > 0).map(c =>
        `<div style="flex:${c[1]};background:var(${c[2]})" data-tip="<b>${c[0]}</b>${fmtFull(c[1])} tokens · ${pct(c[1], tot.total).toFixed(1)}%<br><span class=muted>${c[3]}</span>"></div>`).join("")}</div>
      <div class="legend">${comp.map(c => `<span><span class="sw" style="background:var(${c[2]})"></span>${c[0]}<span class="v num">${fmtTok(c[1])}</span><span class="p num">${pct(c[1], tot.total).toFixed(1)}%</span></span>`).join("")}</div></div>`);
  }

  // breakdown tree
  h.push(`<div class="section"><div class="section-title">Breakdown by agent, subagent and workflow</div><div class="tscroll">
    <table><thead><tr><th>agent</th><th>share of tokens</th><th>tokens</th><th>output</th><th>cost</th><th>time</th><th>calls</th></tr></thead><tbody>`);
  const rows = [];
  const kindLabel = {main: "main", subagent: "subagent", fork: "fork", workflow: "workflow", phase: "phase", "workflow-agent": "agent"};
  function walk(n, depth) {
    const vals = n.kind === "main" ? n.own : n.rollup;
    const kids = n.children || [];
    if (!seenKeys.has(n.key)) { seenKeys.add(n.key); if (kids.length > 6 && n.kind === "phase") collapsed.add(n.key); }
    const open = !collapsed.has(n.key);
    const label = n.kind === "main" ? n.label + " (own)" :
      n.kind === "workflow" ? `${n.label} · ${n.agent_count} agents` :
      n.kind === "phase" ? `${n.label} · ${n.agent_count}` :
      (n.description && n.description !== n.agent_type ? `${n.agent_type} · ${n.description}` : (n.agent_type || n.label));
    const share = pct(vals.total, tot.total);
    const tipText = `<b>${esc(label)}</b>${fmtFull(vals.total)} tokens · ${share.toFixed(1)}%<br>in ${fmtTok(vals.input)} · out ${fmtTok(vals.output)} · cache write ${fmtTok(vals.cache_write)} · cache read ${fmtTok(vals.cache_read)}` +
      (n.models && n.models.length ? `<br><span class=muted>${esc(n.models.join(", "))}</span>` : "") +
      (n.kind !== "main" && n.own && n.own.calls && kids.length ? `<br><span class=muted>own ${fmtTok(n.own.total)} · with children ${fmtTok(n.rollup.total)}</span>` : "");
    rows.push(`<tr><td class="lbl"><div class="t" style="padding-left:${depth * 18}px">
        ${kids.length ? `<button class="tw" data-key="${esc(n.key)}" aria-expanded="${open}" aria-label="${open ? "collapse" : "expand"} ${esc(label)}">${open ? "▾" : "▸"}</button>` : `<span class="tw"></span>`}
        <span class="kind">${kindLabel[n.kind] || n.kind}</span><span class="txt" title="${esc(label)}">${esc(label)}</span></div></td>
      <td><div class="share" data-tip="${esc(tipText)}"><div class="track"><div class="bar" style="width:${Math.max(share, vals.total ? 1 : 0)}%"></div></div><span class="pc num">${share.toFixed(1)}%</span></div></td>
      <td class="num">${fmtTok(vals.total)}</td><td class="num">${fmtTok(vals.output)}</td><td class="num">${fmtCost(vals.cost, vals.cost_partial)}</td>
      <td class="num">${fmtDur(n.duration_s)}</td><td class="num">${fmtFull(vals.calls)}</td></tr>`);
    if (open) kids.forEach(c => walk(c, depth + 1));
  }
  rep.tree.forEach(n => walk(n, 0));
  rows.push(`<tr class="tot"><td>Total</td><td></td><td class="num">${fmtTok(tot.total)}</td><td class="num">${fmtTok(tot.output)}</td>
    <td class="num">${fmtCost(tot.cost, tot.cost_partial)}</td><td class="num">${fmtDur(tm.wall_s)}</td><td class="num">${fmtFull(tot.calls)}</td></tr>`);
  h.push(rows.join(""), "</tbody></table></div></div>");

  const simple = (title, head, items, rowFn) => items.length ? `<div><div class="section-title">${title}</div><div class="tscroll"><table><thead><tr>${head.map(x => `<th>${x}</th>`).join("")}</tr></thead><tbody>${items.map(rowFn).join("")}</tbody></table></div></div>` : "";
  h.push(`<div class="section two">` +
    simple("By model", ["model", "tokens", "input", "output", "cache write", "cache read", "cost"], rep.by_model, m =>
      `<tr><td title="${esc(m.model)}">${esc(shortModel(m.model))}</td><td class="num">${fmtTok(m.total)}</td><td class="num">${fmtTok(m.input)}</td><td class="num">${fmtTok(m.output)}</td><td class="num">${fmtTok(m.cache_write)}</td><td class="num">${fmtTok(m.cache_read)}</td><td class="num">${fmtCost(m.cost, m.cost_partial)}</td></tr>`) +
    simple("By agent type", ["type", "agents", "tokens", "output", "cost"], rep.by_type, x =>
      `<tr><td>${esc(x.agent_type)}</td><td class="num">${x.agents}</td><td class="num">${fmtTok(x.total)}</td><td class="num">${fmtTok(x.output)}</td><td class="num">${fmtCost(x.cost, x.cost_partial)}</td></tr>`) +
    `</div>`);

  if (rep.workflows.length) {
    h.push(`<div class="section">` + simple("Workflows", ["workflow", "agents", "tokens", "output", "cost", "time", "phases"], rep.workflows, w =>
      `<tr><td title="${esc(w.summary || "")}">${esc(w.name)} <span class="muted">${esc(w.run_id)}</span></td><td class="num">${w.agents}</td><td class="num">${fmtTok(w.total)}</td><td class="num">${fmtTok(w.output)}</td><td class="num">${fmtCost(w.cost, w.cost_partial)}</td><td class="num">${fmtDur(w.duration_s)}</td>
       <td class="muted" style="white-space:normal">${w.phases.map(p => `${esc(p.phase)} (${p.agents}) ${fmtTok(p.total)}`).join(" · ")}</td></tr>`) + `</div>`);
  }

  const st = rep.stats || {};
  if (st.prompts !== undefined) {
    h.push(`<div class="section" style="padding-bottom:0"><div class="section-title">Stats</div></div><div class="tiles" style="margin-top:0">
      ${tile("Prompts", fmtFull(st.prompts), st.automatic_turns ? "+" + plural(st.automatic_turns, "automatic turn") : "", "prompts you typed; automatic turns are started by the agent itself (e.g. a background agent finishing)")}
      ${tile("Tokens / prompt", fmtTok(st.tokens_per_prompt), st.cost_per_prompt != null ? fmtCost(st.cost_per_prompt) + " per prompt" : "")}
      ${tile("Avg turn", fmtDur(st.avg_turn_s), "longest " + fmtDur(st.max_turn_s))}
      ${tile("Cache hit", st.cache_hit_ratio != null ? (st.cache_hit_ratio * 100).toFixed(0) + "%" : "–", "cache reads / all input", "share of input tokens served from the prompt cache")}
      ${tile("Output / active min", fmtTok(st.output_per_active_min), "generation speed")}
      ${tile("Tool calls", st.tool_calls != null ? fmtFull(st.tool_calls) : "–", st.tool_calls != null ? plural(st.tool_errors || 0, "error") : "set log.depth to calls", st.tool_calls != null ? "" : "Settings → Logging detail: calls")}
    </div>`);
  }
  if (rep.prompts && rep.prompts.length) {
    const maxTok = Math.max(...rep.prompts.map(p => p.total), 1);
    h.push(`<div class="section"><div class="section-title">Per prompt (${rep.prompts.length})</div><div class="tscroll"><table class="ptable"><thead><tr><th>#</th><th>prompt</th><th>tokens</th><th></th><th>output</th><th>cost</th><th>took</th><th>calls</th><th>agents</th>${st.tool_calls != null ? "<th>tools</th>" : ""}</tr></thead><tbody>${
      rep.prompts.map(p => `<tr><td class="num muted">${p.index}</td><td class="ptxt"><span title="${esc(p.prompt || "")}">${p.prompt != null ? esc(p.prompt) : '<i class="muted">not stored</i>'}</span></td>
        <td class="num">${fmtTok(p.total)}</td><td><div class="share"><div class="track" style="width:70px"><div class="bar" style="width:${pct(p.total, maxTok)}%"></div></div></div></td>
        <td class="num">${fmtTok(p.output)}</td><td class="num">${fmtCost(p.cost, p.cost_partial)}</td><td class="num">${fmtDur(p.duration_s)}</td><td class="num">${p.calls}</td><td class="num">${p.agents || ""}</td>${st.tool_calls != null ? `<td class="num">${p.tool_calls ?? ""}</td>` : ""}</tr>`).join("")}
      ${st.automatic ? `<tr><td></td><td class="ptxt muted">automatic turns (${st.automatic.turns})</td><td class="num">${fmtTok(st.automatic.total)}</td><td></td><td class="num">${fmtTok(st.automatic.output)}</td><td class="num">${fmtCost(st.automatic.cost)}</td><td></td><td class="num">${st.automatic.calls}</td><td></td>${st.tool_calls != null ? "<td></td>" : ""}</tr>` : ""}
      </tbody></table></div></div>`);
  } else if (rep.prompt_list && rep.prompt_list.length) {
    h.push(`<div class="section"><div class="section-title">Prompts (${rep.prompt_list.length})</div><ol class="prompts">${
      rep.prompt_list.map(p => `<li><time class="num">${fmtWhen(p.ts)}</time>${p.prompt != null ? esc(p.prompt.length > 600 ? p.prompt.slice(0, 600) + "…" : p.prompt) : '<i>not stored</i>'}</li>`).join("")}</ol></div>`);
  }
  if (st.tools && st.tools.length) {
    const maxT = st.tools[0].calls;
    h.push(`<div class="section"><div class="section-title">Tools</div><table><thead><tr><th>tool</th><th>calls</th><th></th><th>errors</th></tr></thead><tbody>${
      st.tools.slice(0, 25).map(x => `<tr><td>${esc(x.tool)}</td><td class="num">${fmtFull(x.calls)}</td><td><div class="share"><div class="track"><div class="bar" style="width:${pct(x.calls, maxT)}%"></div></div></div></td><td class="num ${x.errors ? "crit" : "muted"}">${x.errors || ""}</td></tr>`).join("")}</tbody></table></div>`);
  }
  if (unCost || ((un.status === "estimated" || un.status === "partial") && un.total)) {
    h.push(`<div class="note">The cost includes ≈ <span class="num">${fmtCost(un.cost)}</span> (≈ <b class="num">${fmtTok(un.total)}</b> tokens) of Claude Code's own calls that are not written to transcripts (background-agent summaries, prompt suggestions, titles), estimated from the session cost record Claude Code writes on exit${un.status === "partial" ? "; partial, the session continued afterwards" : ""}. The token counts and tables above contain only the logged calls.</div>`);
  }
  if (t.end_note) h.push(`<div class="note">Note: ${esc(t.end_note)}</div>`);
  h.push(sess && sess.agent !== "claude"
    ? `<div class="note">Token counts come from the agent's own session files. Cost is what the agent reported, else an estimate at API list price.</div>`
    : `<div class="note">Token counts come from the agents' transcripts (main session, subagents, workflow agents). Cost is an estimate at API list price.</div>`);
  el.innerHTML = h.join("");
  el._rep = rep;
  $$(".tw[data-key]", el).forEach(tw => tw.onclick = () => {
    const k = tw.dataset.key; collapsed.has(k) ? collapsed.delete(k) : collapsed.add(k); renderDetail(el._rep, target);
  });
  const close = $("[data-close]", el);
  if (close) close.onclick = () => { el.classList.add("hide"); el._rep = null; sessSel = null; history.replaceState(null, "", "#sessions"); $$(".stbl tr.sel").forEach(tr => tr.classList.remove("sel")); };
  if (!sess) wireTaskActions(t);
}

// end / rename / delete, confirmed inline (no browser dialogs)
function wireTaskActions(t) {
  const box = $("#dactions");
  if (!box) return;
  const reset = () => { box.innerHTML = taskActions(t); wireTaskActions(t); };
  $$("button[data-act]", box).forEach(b => b.onclick = () => {
    const act = b.dataset.act;
    if (act === "rename") {
      const top = $("#dtop");
      top.innerHTML = `<form class="rename"><input type="text" value="${esc(t.name)}" aria-label="task name" required><button class="primary sm">Save</button><button type="button" class="sm" data-cancel>Cancel</button></form>`;
      const form = $("form", top), input = $("input", form);
      input.focus(); input.select();
      $("[data-cancel]", form).onclick = () => guard(loadDetail());
      form.onkeydown = e => { if (e.key === "Escape") guard(loadDetail()); };
      form.onsubmit = async e => {
        e.preventDefault();
        await guard(postJSON("/api/tasks/" + t.id, {action: "rename", name: input.value}).then(() => {
          toast("Task #" + t.id + " renamed"); return loadTasks().then(loadDetail);
        }));
      };
      return;
    }
    const label = act === "end" ? "End this task now?" : "Delete this task and its report?";
    box.innerHTML = `<span class="confirm">${label}<button class="sm ${act === "delete" ? "danger primary" : "primary"}" data-yes>${act === "end" ? "End task" : "Delete"}</button><button class="sm" data-no>Cancel</button></span>`;
    $("[data-no]", box).onclick = reset;
    $("[data-yes]", box).onclick = () => guard(postJSON("/api/tasks/" + t.id, {action: act}).then(() => {
      toast(act === "end" ? "Task #" + t.id + " ended" : "Task #" + t.id + " deleted");
      if (act === "delete") { selected = null; history.replaceState(null, "", "#tasks"); }
      return loadTasks().then(loadDetail);
    }));
  });
}

// ---------------------------------------------------------------- todos
const COLS = [["doing", "Doing", "▶"], ["todo", "Todo", "○"], ["blocked", "Blocked", "⏸"], ["done", "Done · last 14 days", "✓"]];
const PRIO = {1: "!", 2: "!!", 3: "!!!"};
const STATUSES = ["todo", "doing", "blocked", "done", "dropped"];
let todoData = null, editing = null;
function dueLabel(t, now) {
  if (!t.due_at) return "";
  const d = new Date(t.due_at * 1000), today = new Date(now * 1000);
  const open = ["todo", "doing", "blocked"].includes(t.status);
  if (t.due_at < now && open) return `<span class="chip warn">overdue · ${WDAY.format(d)}</span>`;

  $$(".stbl tr[data-sid]").forEach(tr => tr.classList.toggle("sel", tr.dataset.sid === sid));
  const el = $("#sdetail");
  el.classList.remove("hide");
  try {
    renderDetail(await getJSON("/api/sessions/" + encodeURIComponent(sid)), el);
    if (scroll) el.scrollIntoView({behavior: "smooth", block: "start"});
  } catch (e) {
    el._rep = null;
    el.innerHTML = '<div class="empty">This session is not in the index (yet).</div>';
  }
}

// ---------------------------------------------------------------- settings
const SETTING_INFO = {
  "log.depth": ["Logging", "Logging detail"],
  "log.prompts": ["Logging", "Prompt text"],
  "projects.default_mode": ["Projects and tasks", "New projects"],
  "auto_start": ["Projects and tasks", "Start tasks automatically"],
  "todos.reminder": ["Todos", "Reminder at session start"],
  "todos.reminder_limit": ["Todos", "Todos in the reminder"],
  "dashboard_port": ["Dashboard", "Port"],
  "dashboard_idle_minutes": ["Dashboard", "Stop when unused (minutes)"],
};
async function loadSettings() {
  const d = await getJSON("/api/settings");
  const groups = {};
  d.settings.forEach(s => { const g = (SETTING_INFO[s.key] || ["Other"])[0]; (groups[g] = groups[g] || []).push(s); });
  $("#settings").innerHTML = Object.entries(groups).map(([g, items]) => `<div class="setgroup"><h3>${g}</h3>${items.map(s => {
    let ctl;
    if (s.allowed === "on/off") ctl = `<select data-key="${s.key}"><option value="on" ${s.value ? "selected" : ""}>on</option><option value="off" ${!s.value ? "selected" : ""}>off</option></select>`;
    else if (s.allowed === "number") ctl = `<input data-key="${s.key}" type="number" min="0" value="${esc(s.value)}">`;
    else ctl = `<select data-key="${s.key}">${s.allowed.split("|").map(v => `<option ${v === s.value ? "selected" : ""}>${v}</option>`).join("")}</select>`;
    const label = (SETTING_INFO[s.key] || [, s.key])[1];
    return `<div class="setrow"><div class="name">${esc(label)}<code>${s.key}</code></div><div class="ctl">${ctl}</div><div class="d">${esc(s.description)}.${s.key === "dashboard_port" || s.key === "dashboard_idle_minutes" ? " Takes effect when the dashboard restarts." : ""}</div></div>`;
  }).join("")}${g === "Dashboard" ? `<div class="setrow"><div class="name">Server<code>tally dashboard --stop</code></div><div class="ctl" id="stopbox"><button type="button" class="sm" data-stop>Stop the dashboard</button></div><div class="d">Stops this local server now; this page goes offline. <code>/tally:dashboard</code> starts it again.</div></div>` : ""}</div>`).join("");
  const box = $("#stopbox");
  const askStop = () => {
    box.innerHTML = `<span class="confirm"><button type="button" class="sm danger primary" data-yes>Stop</button><button type="button" class="sm" data-no>Cancel</button></span>`;
    $("[data-no]", box).onclick = () => { box.innerHTML = '<button type="button" class="sm" data-stop>Stop the dashboard</button>'; $("[data-stop]", box).onclick = askStop; };
    $("[data-yes]", box).onclick = () => guard(postJSON("/api/shutdown", {}).then(() => {
      stopped = true;
      online(false);
      $("#updated").textContent = "dashboard stopped";
      toast("The dashboard is stopped. Start it again with /tally:dashboard or tally dashboard.");
    }));
  };
  if (box) $("[data-stop]", box).onclick = askStop;
  $$("[data-key]", $("#settings")).forEach(el => el.onchange = () =>
    guard(postJSON("/api/settings", {key: el.dataset.key, value: el.value}).then(() => toast("Saved " + ((SETTING_INFO[el.dataset.key] || [, el.dataset.key])[1]) + ": " + el.value))
      .catch(e => { loadSettings(); throw e; })));
}

// ---------------------------------------------------------------- boot
async function refreshAll() {
  try { await loadTasks(); await loadDetail(); }
  catch (e) { if (!$("#status").classList.contains("off")) toast(e.message, true); }
}
$("#refresh").onclick = () => {
  const b = $("#refresh");
  b.classList.add("spin");
  setTimeout(() => b.classList.remove("spin"), 700);
  guard(loadProjects()); if (view === "sessions") guard(loadSessions(true)); else setView(view);
};
document.addEventListener("keydown", e => {
  if (e.target.closest("input, textarea, select") || e.metaKey || e.ctrlKey || e.altKey) return;
  if (e.key === "r") $("#refresh").click();
  if (e.key === "/" && view === "tasks") { e.preventDefault(); $("#tsearch").focus(); }
});
window.addEventListener("hashchange", () => {
  const h = parseHash();
  if (h.view !== view) setView(h.view);
  if (h.view === "tasks" && h.id && h.id !== selected) { selected = h.id; renderTasks(); guard(loadDetail()); }
  if (h.view === "sessions" && h.sid && h.sid !== sessSel) selectSession(h.sid, true);
  if (h.view === "projects" && h.pname && h.pname !== projSel && view === "projects") selectProject(h.pname, true);
});
getJSON("/api/health").then(d => { $("#ver").textContent = "v" + d.version; }).catch(() => {});
renderGlobalExport();
loadProjects().catch(() => {}).then(() => setView(view));
let ticks = 0;
setInterval(() => {
  if (document.hidden || stopped) return;
  if (++ticks % 12 === 0) getJSON("/api/health").catch(() => {});   // an open page keeps the server from its idle stop
  if (view === "todos") { if (editing === null) loadTodos().catch(() => {}); return; }
  if (view === "projects" || view === "settings") return;
  if (view === "sessions") { if (Date.now() - sessLoaded > 30000) loadSessions().catch(() => {}); return; }
  const cur = tasks.find(t => t.id === selected);
  if (tasks.some(t => t.status === "active")) loadTasks().catch(() => {});
  if (cur && cur.status === "active" && !$("#dtop form")) loadDetail();
}, 5000);
</script>
</body>
