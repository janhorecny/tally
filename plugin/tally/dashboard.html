<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tally</title>
<style>
.viz-root {
  color-scheme: light;
  --page: #f9f9f7;
  --surface-1: #fcfcfb;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --grid: #e1e0d9;
  --baseline: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --hover: rgba(11,11,11,0.04);
  --select: rgba(42,120,214,0.10);
  --series-1: #2a78d6;  /* input        */
  --series-2: #eb6834;  /* output       */
  --series-3: #1baf7a;  /* cache write  */
  --series-4: #eda100;  /* cache read   */
  --seq: #2a78d6;       /* token share (single hue, magnitude) */
  --seq-track: #e1e0d9;
  --good: #0ca30c;
  --critical: #d03b3b;
  --muted-status: #898781;
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) .viz-root {
    color-scheme: dark;
    --page: #0d0d0d; --surface-1: #1a1a19; --text-primary: #f0efec; --text-secondary: #c3c2b7;
    --text-muted: #898781; --grid: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,0.10);
    --hover: rgba(255,255,255,0.05); --select: rgba(57,135,229,0.18);
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
    --seq: #3987e5; --seq-track: #2c2c2a;
  }
}
:root[data-theme="dark"] .viz-root {
  color-scheme: dark;
  --page: #0d0d0d; --surface-1: #1a1a19; --text-primary: #f0efec; --text-secondary: #c3c2b7;
  --text-muted: #898781; --grid: #2c2c2a; --baseline: #383835; --border: rgba(255,255,255,0.10);
  --hover: rgba(255,255,255,0.05); --select: rgba(57,135,229,0.18);
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
  --seq: #3987e5; --seq-track: #2c2c2a;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif; }
.viz-root { background: var(--page); color: var(--text-primary); min-height: 100vh; }
.num { font-variant-numeric: tabular-nums; }
header { display: flex; align-items: center; gap: 16px; padding: 14px 24px; border-bottom: 1px solid var(--border);
  background: var(--surface-1); position: sticky; top: 0; z-index: 5; }
header h1 { font-size: 15px; margin: 0; font-weight: 650; letter-spacing: .01em; }
header .sub { color: var(--text-muted); font-size: 12px; }
header .spacer { flex: 1; }
button, select { font: inherit; color: var(--text-primary); background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 6px; padding: 4px 10px; cursor: pointer; }
button:hover { background: var(--hover); }
main { display: grid; grid-template-columns: minmax(320px, 400px) 1fr; gap: 20px; padding: 20px 24px; align-items: start; }
@media (max-width: 960px) { main { grid-template-columns: 1fr; } }
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; }
.card > h2, .section-title { font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: none;
  margin: 0; padding: 14px 16px 8px; letter-spacing: .02em; }
.tasklist { max-height: calc(100vh - 110px); overflow: auto; }
.trow { display: grid; grid-template-columns: 14px 1fr auto; gap: 4px 10px; padding: 10px 16px; cursor: pointer;
  border-top: 1px solid var(--border); }
.trow:hover { background: var(--hover); }
.trow.sel { background: var(--select); }
.trow .name { font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trow .meta { grid-column: 2 / 4; color: var(--text-muted); font-size: 12px; display: flex; gap: 10px; flex-wrap: wrap; }
.trow .tok { text-align: right; font-weight: 600; }
.dot { width: 9px; height: 9px; border-radius: 50%; margin-top: 6px; background: var(--muted-status); }
.dot.active { background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 25%, transparent); }
.badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 2px 8px;
  border-radius: 999px; border: 1px solid var(--border); color: var(--text-secondary); }
.badge .dot { margin: 0; }
#detail { min-width: 0; }
.empty { color: var(--text-muted); padding: 40px; text-align: center; }
.dhead { padding: 18px 20px 6px; }
.dhead h2 { font-size: 20px; margin: 0 0 6px; font-weight: 650; line-height: 1.25; overflow-wrap: anywhere; }
.dhead .line { color: var(--text-secondary); font-size: 13px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.prompt { margin: 10px 20px 0; padding: 10px 12px; border-left: 3px solid var(--baseline); color: var(--text-secondary);
  white-space: pre-wrap; max-height: 120px; overflow: auto; font-size: 13px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 1px; background: var(--border);
  border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); margin-top: 16px; }
.tile { background: var(--surface-1); padding: 14px 16px; }
.tile .label { color: var(--text-secondary); font-size: 12px; }
.tile .value { font-size: 24px; font-weight: 650; margin-top: 2px; }
.tile .hint { color: var(--text-muted); font-size: 12px; }
.section { padding: 4px 20px 18px; }
.section-title { padding: 16px 0 10px; }
.stack { display: flex; height: 14px; gap: 2px; border-radius: 4px; overflow: hidden; background: var(--surface-1); }
.stack div { height: 100%; min-width: 2px; cursor: default; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 22px; margin-top: 10px; font-size: 13px; }
.legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.legend .v { font-weight: 600; margin-left: 4px; }
.legend .p { color: var(--text-muted); margin-left: 4px; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: right; font-weight: 600; color: var(--text-muted); font-size: 12px; padding: 6px 8px; border-bottom: 1px solid var(--baseline); white-space: nowrap; }
td { text-align: right; padding: 6px 8px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
td.lbl { white-space: normal; max-width: 0; width: 42%; }
td.lbl .t { display: flex; align-items: center; gap: 6px; min-width: 0; }
td.lbl .t span.txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
tr.tot td { font-weight: 650; border-top: 1px solid var(--baseline); border-bottom: none; }
tr:hover td { background: var(--hover); }
.kind { font-size: 11px; color: var(--text-muted); border: 1px solid var(--border); border-radius: 4px; padding: 0 5px; flex: none; }
.tw { width: 16px; flex: none; color: var(--text-muted); cursor: pointer; user-select: none; text-align: center; }
.share { display: flex; align-items: center; gap: 8px; justify-content: flex-end; }
.share .track { width: 110px; height: 8px; background: var(--seq-track); border-radius: 4px; overflow: hidden; }
.share .bar { height: 100%; background: var(--seq); border-radius: 0 4px 4px 0; }
.share .pc { width: 44px; color: var(--text-secondary); }
.muted { color: var(--text-muted); }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 0 28px; }
@media (max-width: 1200px) { .two { grid-template-columns: 1fr; } }
.prompts li { margin: 0 0 8px; color: var(--text-secondary); white-space: pre-wrap; overflow-wrap: anywhere; }
.prompts time { color: var(--text-muted); font-size: 12px; margin-right: 8px; }
#tip { position: fixed; pointer-events: none; z-index: 20; background: var(--surface-1); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px; box-shadow: 0 6px 24px rgba(0,0,0,.18);
  display: none; max-width: 320px; }
#tip b { display: block; margin-bottom: 2px; }
.note { color: var(--text-muted); font-size: 12px; padding: 0 20px 18px; }
nav.tabs { display: flex; gap: 2px; margin-left: 12px; }
nav.tabs a { color: var(--text-secondary); text-decoration: none; padding: 5px 12px; border-radius: 6px; font-weight: 550; }
nav.tabs a:hover { background: var(--hover); }
nav.tabs a.on { background: var(--select); color: var(--text-primary); }
.view { display: none; }
.view.on { display: block; }
#view-tasks.on { display: grid; }
.chip { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 999px; border: 1px solid var(--border); color: var(--text-secondary); }
.crit { color: var(--critical); font-weight: 600; }
.wrap { padding: 20px 24px; }
.addbar { display: flex; gap: 8px; margin-bottom: 16px; }
.addbar input { flex: 1; font: inherit; color: var(--text-primary); background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px; }
.addbar .hint { color: var(--text-muted); font-size: 12px; align-self: center; }
.board { display: grid; grid-template-columns: repeat(4, minmax(220px, 1fr)); gap: 14px; align-items: start; }
@media (max-width: 1100px) { .board { grid-template-columns: repeat(2, minmax(220px, 1fr)); } }
.col { background: var(--surface-1); border: 1px solid var(--border); border-radius: 10px; padding: 10px; min-height: 120px; }
.col h3 { font-size: 12px; margin: 2px 4px 10px; color: var(--text-secondary); display: flex; justify-content: space-between; }
.tcard { border: 1px solid var(--border); border-radius: 8px; padding: 10px 11px; margin-bottom: 8px; background: var(--page); }
.tcard .ttl { font-weight: 600; overflow-wrap: anywhere; }
.tcard .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-top: 6px; font-size: 12px; color: var(--text-muted); }
.tcard select { font-size: 12px; padding: 2px 6px; }
.tcard details { margin-top: 6px; font-size: 13px; }
.tcard summary { cursor: pointer; color: var(--text-secondary); font-size: 12px; }
.tcard .steps { list-style: none; padding: 4px 0 0; margin: 0; }
.tcard .steps li { display: flex; gap: 6px; align-items: flex-start; padding: 2px 0; }
.tcard .steps li.done span { color: var(--text-muted); text-decoration: line-through; }
.prog { display: flex; align-items: center; gap: 6px; }
.prog .track { width: 80px; height: 6px; background: var(--seq-track); border-radius: 3px; overflow: hidden; }
.prog .bar { height: 100%; background: var(--seq); }
.settings { max-width: 760px; }
.setrow { display: grid; grid-template-columns: 200px 180px 1fr; gap: 14px; align-items: center; padding: 12px 16px; border-top: 1px solid var(--border); }
.setrow:first-of-type { border-top: none; }
.setrow code { font-size: 12px; }
.setrow .d { color: var(--text-secondary); font-size: 13px; }
.setrow .ok { color: var(--good); font-size: 12px; margin-left: 6px; }
.toolbar { display: flex; gap: 6px; align-items: center; }
#stable { max-height: 58vh; overflow: auto; }
.stbl thead th { position: sticky; top: 0; background: var(--surface-1); z-index: 1; }
.stbl td.ttl { white-space: normal; max-width: 0; width: 28%; }
.stbl td.ttl span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.stbl th:nth-child(-n+4), .stbl td:nth-child(-n+4), .stbl th:last-child, .stbl td:last-child { text-align: left; }
.stbl tr { cursor: pointer; }
.stbl tr.sel td { background: var(--select); }
.ptable td.ptxt { white-space: normal; max-width: 0; width: 38%; color: var(--text-secondary); text-align: left; }
.ptable th:nth-child(2) { text-align: left; }
.ptable td.ptxt span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
</style>
</head>
<body>
<div class="viz-root">
  <header>
    <h1>tally</h1>
    <nav class="tabs" aria-label="Views">
      <a href="#tasks" data-view="tasks">Tasks</a><a href="#todos" data-view="todos">Todos</a><a href="#projects" data-view="projects">Projects</a><a href="#sessions" data-view="sessions">Sessions</a><a href="#settings" data-view="settings">Settings</a>
    </nav>
    <span class="spacer"></span>
    <select id="project" aria-label="Project"><option value="">All projects</option></select>
    <span class="sub num" id="updated"></span>
    <select id="theme" aria-label="Theme">
      <option value="">Auto</option><option value="light">Light</option><option value="dark">Dark</option>
    </select>
    <button id="refresh">Refresh</button>
  </header>
  <main id="view-tasks" class="view">
    <section class="card tasklist" aria-label="Tasks">
      <h2>Tasks</h2>
      <div id="tasks"><div class="empty">Loading…</div></div>
    </section>
    <section class="card" id="detail"><div class="empty">Select a task.</div></section>
  </main>
  <div id="view-todos" class="view wrap">
    <form class="addbar" id="addform" autocomplete="off">
      <input id="addtext" placeholder="Add a todo… e.g. Fix login redirect @web !! due:fri -- check Safari" aria-label="New todo">
      <button type="submit">Add</button>
    </form>
    <div class="board" id="board"></div>
  </div>
  <div id="view-projects" class="view wrap">
    <section class="card"><h2>Projects</h2><div id="projtable"></div></section>
    <section class="card" id="projdetail" style="margin-top:20px"></section>
  </div>
  <div id="view-sessions" class="view wrap">
    <div class="toolbar" style="margin-bottom:14px">
      <select id="sdays" aria-label="Period"><option value="1">Last 24 hours</option><option value="7">Last 7 days</option><option value="30" selected>Last 30 days</option><option value="90">Last 90 days</option><option value="">All time</option></select>
      <select id="sagent" aria-label="Agent"><option value="">All agents</option><option value="claude">Claude Code</option><option value="codex">Codex</option><option value="pi">pi</option></select>
      <span class="sub num" id="sindex"></span>
    </div>
    <section class="card"><div id="stiles"></div><div id="stable"><div class="empty">Loading…</div></div></section>
    <section class="card" id="sdetail" style="margin-top:20px; display:none"></section>
  </div>
  <div id="view-settings" class="view wrap">
    <section class="card settings"><h2>Settings</h2><div id="settings"></div></section>
    <p class="note" style="padding:12px 0">Stored in ~/.claude/tally/config.json. Also: <code>/tally:settings</code> in Claude Code or <code>tally settings</code>.</p>
  </div>
  <div id="tip" role="tooltip"></div>
</div>
<script>
"use strict";
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtTok = n => n == null ? "–" : n < 1e3 ? String(n) : n < 1e6 ? (n/1e3).toFixed(1) + "k" : n < 1e9 ? (n/1e6).toFixed(2) + "M" : (n/1e9).toFixed(2) + "B";
const fmtFull = n => (n ?? 0).toLocaleString();
const fmtCost = (c, partial) => c == null ? "–" : (c >= 0.995 || c === 0 ? "$" + c.toFixed(2) : "$" + c.toFixed(3)) + (partial ? "+" : "");
function fmtDur(s) {
  if (s == null) return "–";
  s = Math.round(s);
  if (s < 60) return s + "s";
  if (s < 3600) return Math.floor(s/60) + "m " + String(s%60).padStart(2,"0") + "s";
  if (s < 86400) return Math.floor(s/3600) + "h " + String(Math.floor(s%3600/60)).padStart(2,"0") + "m";
  return Math.floor(s/86400) + "d " + String(Math.floor(s%86400/3600)).padStart(2,"0") + "h";
}
const fmtWhen = ts => ts ? new Date(ts*1000).toLocaleString([], {month:"short", day:"numeric", hour:"2-digit", minute:"2-digit"}) : "–";
const pct = (a, b) => b ? (a / b * 100) : 0;

// ---------------------------------------------------------------- theme
const themeSel = $("#theme");
themeSel.value = localStorage.getItem("tc-theme") || "";
function applyTheme() {
  const v = themeSel.value;
  if (v) document.documentElement.setAttribute("data-theme", v); else document.documentElement.removeAttribute("data-theme");
  localStorage.setItem("tc-theme", v);
}
themeSel.onchange = applyTheme; applyTheme();

// ---------------------------------------------------------------- tooltip
const tip = $("#tip");
document.addEventListener("mousemove", e => {
  const t = e.target.closest("[data-tip]");
  if (!t) { tip.style.display = "none"; return; }
  tip.innerHTML = t.getAttribute("data-tip");
  tip.style.display = "block";
  const r = tip.getBoundingClientRect();
  let x = e.clientX + 14, y = e.clientY + 14;
  if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
  if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 14;
  tip.style.left = x + "px"; tip.style.top = y + "px";
});

// ---------------------------------------------------------------- state
function parseHash() {
  const h = location.hash.slice(1);
  if (/^\d+$/.test(h)) return {view: "tasks", id: Number(h)};
  const [v, id] = h.split("/");
  if (v === "sessions") return {view: v, id: null, sid: id ? decodeURIComponent(id) : null};
  return {view: ["tasks", "todos", "projects", "settings"].includes(v) ? v : "tasks", id: Number(id) || null};
}
let view = parseHash().view;
let selected = parseHash().id;
let tasks = [];
let project = localStorage.getItem("tc-project") || "";
async function postJSON(url, body) {
  const r = await fetch(url, {method: "POST", headers: {"Content-Type": "application/json", "X-Tally": "1"}, body: JSON.stringify(body)});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.error || r.status);
  return d;
}
function setView(v) {
  view = v;
  document.querySelectorAll(".view").forEach(el => el.classList.toggle("on", el.id === "view-" + v));
  document.querySelectorAll("nav.tabs a").forEach(a => a.classList.toggle("on", a.dataset.view === v));
  if (v === "todos") loadTodos();
  if (v === "settings") loadSettings();
  if (v === "projects") loadProjectsView();
  if (v === "sessions") loadSessions();
  if (v === "tasks") refreshAll();
}
async function loadProjects() {
  const d = await getJSON("/api/projects");
  const sel = $("#project");
  sel.innerHTML = '<option value="">All projects</option>' + d.projects.map(p =>
    `<option value="${esc(p.project)}">${esc(p.project)}${p.open_todos ? " · " + p.open_todos + " open" : ""}</option>`).join("");
  sel.value = d.projects.some(p => p.project === project) ? project : "";
}
$("#project").onchange = e => { project = e.target.value; localStorage.setItem("tc-project", project); selected = null; setView(view); };
const collapsed = new Set();
const seenKeys = new Set();       // nodes with many children start collapsed
let lastDetail = null;

async function getJSON(url) {
  const r = await fetch(url, {cache: "no-store"});
  if (!r.ok) throw new Error(r.status + " " + url);
  return r.json();
}

async function loadTasks() {
  const d = await getJSON("/api/tasks?limit=200" + (project ? "&project=" + encodeURIComponent(project) : ""));
  tasks = d.tasks;
  if (!selected && tasks.length) selected = tasks[0].id;
  renderTasks();
  $("#updated").textContent = "updated " + new Date().toLocaleTimeString();
}

function renderTasks() {
  const el = $("#tasks");
  if (!tasks.length) {
    el.innerHTML = '<div class="empty">No tasks yet.<br>In Claude Code run <b>/tally:start &lt;name&gt;</b> or <b>/tally:new &lt;prompt&gt;</b>.</div>';
    return;
  }
  el.innerHTML = tasks.map(t => `
    <div class="trow ${t.id === selected ? "sel" : ""}" data-id="${t.id}" role="button" tabindex="0">
      <span class="dot ${t.status === "active" ? "active" : ""}" title="${t.status}"></span>
      <span class="name" title="${esc(t.name)}">#${t.id} · ${esc(t.name)}</span>
      <span class="tok num">${fmtTok(t.total)}</span>
      <span class="meta num"><span>${t.status === "active" ? "active" : "ended"}</span>${t.project && !project ? `<span class="chip">${esc(t.project)}</span>` : ""}<span>${fmtWhen(t.started_at)}</span>
        <span>wall ${fmtDur(t.wall_s)}</span><span>active ${fmtDur(t.active_s)}</span><span>${fmtCost(t.cost, t.cost_partial)}</span></span>
    </div>`).join("");
  el.querySelectorAll(".trow").forEach(r => {
    const go = () => { selected = Number(r.dataset.id); history.replaceState(null, "", "#tasks/" + selected); renderTasks(); loadDetail(); };
    r.onclick = go; r.onkeydown = e => { if (e.key === "Enter") go(); };
  });
}

async function loadDetail() {
  if (!selected) return;
  try {
    const rep = await getJSON("/api/tasks/" + selected);
    lastDetail = rep;
    renderDetail(rep);
  } catch (e) {
    $("#detail").innerHTML = '<div class="empty">Task not found.</div>';
  }
}

function tile(label, value, hint, tipText) {
  return `<div class="tile"${tipText ? ` data-tip="${esc(tipText)}"` : ""}><div class="label">${label}</div>
    <div class="value num">${value}</div><div class="hint num">${hint || "&nbsp;"}</div></div>`;
}

function renderDetail(rep, target) {
  const el = target || $("#detail");
  const t = rep.task, tm = rep.time, tot = rep.totals, sess = rep.session;
  const active = t.status === "active";
  const agents = rep.by_type.filter(x => x.agent_type !== "main").reduce((a, x) => a + x.agents, 0);
  const comp = [
    ["Input", tot.input, "--series-1", "uncached input tokens"],
    ["Output", tot.output, "--series-2", "generated tokens (incl. thinking)"],
    ["Cache write", tot.cache_write, "--series-3", "tokens written to the prompt cache"],
    ["Cache read", tot.cache_read, "--series-4", "tokens served from the prompt cache"],
  ];
  const h = [];
  if (sess) h.push(`<div class="dhead"><h2>${esc(sess.title || "Session " + sess.session_id)}</h2>
    <div class="line"><span class="badge">${esc(AGENTS[sess.agent] || sess.agent)}</span>
    <span class="num">${fmtWhen(t.started_at)} → ${fmtWhen(t.ended_at)}</span>
    ${sess.project ? `<span class="chip">${esc(sess.project)}</span>` : ""}
    ${sess.cwd ? `<span class="muted">${esc(sess.cwd)}</span>` : ""}
    <span class="muted num">${esc(sess.session_id)}</span></div></div>`);
  else h.push(`<div class="dhead"><h2>#${t.id} · ${esc(t.name)}</h2>
    <div class="line"><span class="badge"><span class="dot ${active ? "active" : ""}"></span>${active ? "active" : "ended"}</span>
    <span class="num">${fmtWhen(t.started_at)}${t.ended_at ? " → " + fmtWhen(t.ended_at) : ""}</span>
    ${t.project ? `<span class="chip">${esc(t.project)}</span>` : ""}
    ${t.todo ? `<a class="chip" href="#todos" title="linked todo">todo #${t.todo.id} · ${esc(t.todo.status)}</a>` : ""}
    ${t.cwd ? `<span class="muted">${esc(t.cwd)}</span>` : ""}
    <span class="muted">${t.sessions.length} session${t.sessions.length === 1 ? "" : "s"} · ${t.prompt_count} prompt${t.prompt_count === 1 ? "" : "s"}</span></div></div>`);
  if (t.initial_prompt) h.push(`<div class="prompt">${esc(t.initial_prompt)}</div>`);
  h.push(`<div class="tiles">
    ${tile("Total tokens", fmtTok(tot.total), fmtFull(tot.total), "input + output + cache write + cache read")}
    ${tile("Output tokens", fmtTok(tot.output), fmtFull(tot.output))}
    ${tile("Est. cost", fmtCost(tot.cost, tot.cost_partial), "at API list price", "Estimate from token counts and list prices; subscription plans are not billed per token.")}
    ${tile("Wall time", fmtDur(tm.wall_s), active ? "running" : "start → end")}
    ${tile("Active time", fmtDur(tm.active_s), tm.turns + " turn" + (tm.turns === 1 ? "" : "s"), "time the agent was working on turns")}
    ${tile("API calls", fmtFull(tot.calls), agents + " agent" + (agents === 1 ? "" : "s"))}
  </div>`);

  // composition
  if (tot.total) {
    h.push(`<div class="section"><div class="section-title">Token composition</div>
      <div class="stack" role="img" aria-label="Token composition">${comp.filter(c => c[1] > 0).map(c =>
        `<div style="flex:${c[1]};background:var(${c[2]})" data-tip="<b>${c[0]}</b>${fmtFull(c[1])} tokens · ${pct(c[1], tot.total).toFixed(1)}%<br><span class=muted>${c[3]}</span>"></div>`).join("")}</div>
      <div class="legend">${comp.map(c => `<span><span class="sw" style="background:var(${c[2]})"></span>${c[0]}<span class="v num">${fmtTok(c[1])}</span><span class="p num">${pct(c[1], tot.total).toFixed(1)}%</span></span>`).join("")}</div></div>`);
  }

  // breakdown tree
  h.push(`<div class="section"><div class="section-title">Breakdown by agent, subagent and workflow</div>
    <table><thead><tr><th>agent</th><th>share of tokens</th><th>tokens</th><th>output</th><th>cost</th><th>time</th><th>calls</th></tr></thead><tbody>`);
  const rows = [];
  const kindLabel = {main: "main", subagent: "subagent", fork: "fork", workflow: "workflow", phase: "phase", "workflow-agent": "agent"};
  function walk(n, depth) {
    const vals = n.kind === "main" ? n.own : n.rollup;
    const kids = n.children || [];
    if (!seenKeys.has(n.key)) { seenKeys.add(n.key); if (kids.length > 12 && (n.kind === "phase" || n.kind === "workflow")) collapsed.add(n.key); }
    const open = !collapsed.has(n.key);
    let label = n.kind === "main" ? n.label + " (own)" :
      n.kind === "workflow" ? `${n.label} · ${n.agent_count} agents` :
      n.kind === "phase" ? `${n.label} · ${n.agent_count}` :
      (n.description && n.description !== n.agent_type ? `${n.agent_type} · ${n.description}` : (n.agent_type || n.label));
    const share = pct(vals.total, tot.total);
    const tipText = `<b>${esc(label)}</b>${fmtFull(vals.total)} tokens · ${share.toFixed(1)}% of task<br>in ${fmtTok(vals.input)} · out ${fmtTok(vals.output)} · cache write ${fmtTok(vals.cache_write)} · cache read ${fmtTok(vals.cache_read)}` +
      (n.models && n.models.length ? `<br><span class=muted>${esc(n.models.join(", "))}</span>` : "") +
      (n.kind !== "main" && n.own && n.own.calls && kids.length ? `<br><span class=muted>own ${fmtTok(n.own.total)} · with children ${fmtTok(n.rollup.total)}</span>` : "");
    rows.push(`<tr><td class="lbl"><div class="t" style="padding-left:${depth * 18}px">
        <span class="tw" data-key="${esc(n.key)}">${kids.length ? (open ? "▾" : "▸") : ""}</span>
        <span class="kind">${kindLabel[n.kind] || n.kind}</span><span class="txt" title="${esc(label)}">${esc(label)}</span></div></td>
      <td><div class="share" data-tip="${esc(tipText)}"><div class="track"><div class="bar" style="width:${Math.max(share, vals.total ? 1 : 0)}%"></div></div><span class="pc num">${share.toFixed(1)}%</span></div></td>
      <td class="num">${fmtTok(vals.total)}</td><td class="num">${fmtTok(vals.output)}</td><td class="num">${fmtCost(vals.cost, vals.cost_partial)}</td>
      <td class="num">${fmtDur(n.duration_s)}</td><td class="num">${fmtFull(vals.calls)}</td></tr>`);
    if (open) kids.forEach(c => walk(c, depth + 1));
  }
  rep.tree.forEach(n => walk(n, 0));
  rows.push(`<tr class="tot"><td>Total</td><td></td><td class="num">${fmtTok(tot.total)}</td><td class="num">${fmtTok(tot.output)}</td>
    <td class="num">${fmtCost(tot.cost, tot.cost_partial)}</td><td class="num">${fmtDur(tm.wall_s)}</td><td class="num">${fmtFull(tot.calls)}</td></tr>`);
  h.push(rows.join(""), "</tbody></table></div>");

  // models + types
  const simple = (title, head, items, rowFn) => items.length ? `<div><div class="section-title">${title}</div><table><thead><tr>${head.map(x => `<th>${x}</th>`).join("")}</tr></thead><tbody>${items.map(rowFn).join("")}</tbody></table></div>` : "";
  h.push(`<div class="section two">` +
    simple("By model", ["model", "tokens", "input", "output", "cache write", "cache read", "cost"], rep.by_model, m =>
      `<tr><td>${esc(m.model)}</td><td class="num">${fmtTok(m.total)}</td><td class="num">${fmtTok(m.input)}</td><td class="num">${fmtTok(m.output)}</td><td class="num">${fmtTok(m.cache_write)}</td><td class="num">${fmtTok(m.cache_read)}</td><td class="num">${fmtCost(m.cost, m.cost_partial)}</td></tr>`) +
    simple("By agent type", ["type", "agents", "tokens", "output", "cost"], rep.by_type, x =>
      `<tr><td>${esc(x.agent_type)}</td><td class="num">${x.agents}</td><td class="num">${fmtTok(x.total)}</td><td class="num">${fmtTok(x.output)}</td><td class="num">${fmtCost(x.cost, x.cost_partial)}</td></tr>`) +
    `</div>`);

  if (rep.workflows.length) {
    h.push(`<div class="section">` + simple("Workflows", ["workflow", "agents", "tokens", "output", "cost", "time", "phases"], rep.workflows, w =>
      `<tr><td title="${esc(w.summary || "")}">${esc(w.name)} <span class="muted">${esc(w.run_id)}</span></td><td class="num">${w.agents}</td><td class="num">${fmtTok(w.total)}</td><td class="num">${fmtTok(w.output)}</td><td class="num">${fmtCost(w.cost, w.cost_partial)}</td><td class="num">${fmtDur(w.duration_s)}</td>
       <td class="muted" style="white-space:normal">${w.phases.map(p => `${esc(p.phase)} (${p.agents}) ${fmtTok(p.total)}`).join(" · ")}</td></tr>`) + `</div>`);
  }

  const st = rep.stats || {};
  if (st.prompts !== undefined) {
    h.push(`<div class="section"><div class="section-title">Stats</div></div><div class="tiles" style="margin-top:0">
      ${tile("Prompts", fmtFull(st.prompts), st.automatic_turns ? "+" + st.automatic_turns + " automatic turns" : "", "user prompts while the task was open; automatic turns are started by Claude Code itself (e.g. background agents finishing)")}
      ${tile("Tokens / prompt", fmtTok(st.tokens_per_prompt), st.cost_per_prompt != null ? fmtCost(st.cost_per_prompt) + " per prompt" : "")}
      ${tile("Avg turn", fmtDur(st.avg_turn_s), "longest " + fmtDur(st.max_turn_s))}
      ${tile("Cache hit", st.cache_hit_ratio != null ? (st.cache_hit_ratio * 100).toFixed(0) + "%" : "–", "cache reads / all input", "share of input tokens served from the prompt cache")}
      ${tile("Output / active min", fmtTok(st.output_per_active_min), "generation speed")}
      ${tile("Tool calls", st.tool_calls != null ? fmtFull(st.tool_calls) : "–", st.tool_calls != null ? (st.tool_errors || 0) + " errors" : "log.depth = calls to enable", "")}
    </div>`);
  }
  if (rep.prompts && rep.prompts.length) {
    const maxTok = Math.max(...rep.prompts.map(p => p.total), 1);
    h.push(`<div class="section"><div class="section-title">Per prompt (${rep.prompts.length})</div><table class="ptable"><thead><tr><th>#</th><th>prompt</th><th>tokens</th><th></th><th>output</th><th>cost</th><th>took</th><th>calls</th><th>agents</th>${st.tool_calls != null ? "<th>tools</th>" : ""}</tr></thead><tbody>${
      rep.prompts.map(p => `<tr><td class="num muted">${p.index}</td><td class="ptxt"><span title="${esc(p.prompt || "")}">${p.prompt != null ? esc(p.prompt) : '<i class="muted">not stored</i>'}</span></td>
        <td class="num">${fmtTok(p.total)}</td><td><div class="share"><div class="track" style="width:70px"><div class="bar" style="width:${pct(p.total, maxTok)}%"></div></div></div></td>
        <td class="num">${fmtTok(p.output)}</td><td class="num">${fmtCost(p.cost, p.cost_partial)}</td><td class="num">${fmtDur(p.duration_s)}</td><td class="num">${p.calls}</td><td class="num">${p.agents || ""}</td>${st.tool_calls != null ? `<td class="num">${p.tool_calls ?? ""}</td>` : ""}</tr>`).join("")}
      ${st.automatic ? `<tr><td></td><td class="ptxt muted">automatic turns (${st.automatic.turns})</td><td class="num">${fmtTok(st.automatic.total)}</td><td></td><td class="num">${fmtTok(st.automatic.output)}</td><td class="num">${fmtCost(st.automatic.cost)}</td><td></td><td class="num">${st.automatic.calls}</td><td></td>${st.tool_calls != null ? "<td></td>" : ""}</tr>` : ""}
      </tbody></table></div>`);
  } else if (rep.prompt_list && rep.prompt_list.length) {
    h.push(`<div class="section"><div class="section-title">Prompts (${rep.prompt_list.length})</div><ol class="prompts">${
      rep.prompt_list.map(p => `<li><time class="num">${fmtWhen(p.ts)}</time>${p.prompt != null ? esc(p.prompt.length > 600 ? p.prompt.slice(0, 600) + "…" : p.prompt) : '<i>not stored</i>'}</li>`).join("")}</ol></div>`);
  }
  if (st.tools && st.tools.length) {
    const maxT = st.tools[0].calls;
    h.push(`<div class="section"><div class="section-title">Tools</div><table><thead><tr><th>tool</th><th>calls</th><th></th><th>errors</th></tr></thead><tbody>${
      st.tools.slice(0, 25).map(x => `<tr><td>${esc(x.tool)}</td><td class="num">${fmtFull(x.calls)}</td><td><div class="share"><div class="track"><div class="bar" style="width:${pct(x.calls, maxT)}%"></div></div></div></td><td class="num ${x.errors ? "crit" : "muted"}">${x.errors || ""}</td></tr>`).join("")}</tbody></table></div>`);
  }
  const un = rep.unlogged || {};
  if ((un.status === "estimated" || un.status === "partial") && un.total) {
    h.push(`<div class="note">Plus ≈ <b class="num">${fmtTok(un.total)}</b> tokens (<span class="num">${fmtCost(un.cost)}</span>) of Claude Code's own calls that are not written to transcripts (background-agent summaries, prompt suggestions, titles). Estimated from the session cost record Claude Code writes on exit${un.status === "partial" ? "; partial, the session continued afterwards" : ""}. Not included in the totals above.</div>`);
  }
  if (t.end_note) h.push(`<div class="note">Note: ${esc(t.end_note)}</div>`);
  h.push(sess && sess.agent !== "claude"
    ? `<div class="note">Token counts come from the agent's own session files. Cost is what the agent reported, else an estimate at API list price.</div>`
    : `<div class="note">Token counts come from Claude Code transcripts (main session, subagents, workflow agents). Cost is an estimate at API list price.</div>`);
  el.innerHTML = h.join("");
  el._rep = rep;
  el.querySelectorAll(".tw[data-key]").forEach(tw => tw.onclick = () => {
    const k = tw.dataset.key; collapsed.has(k) ? collapsed.delete(k) : collapsed.add(k); renderDetail(el._rep, el);
  });
}

// ---------------------------------------------------------------- todos
const COLS = [["doing", "▶ Doing"], ["todo", "○ Todo"], ["blocked", "⏸ Blocked"], ["done", "✓ Done (14 days)"]];
const PRIO = {1: "!", 2: "!!", 3: "!!!"};
function dueLabel(t, now) {
  if (!t.due_at) return "";
  const d = new Date(t.due_at * 1000), today = new Date(now * 1000);
  const day = d.toLocaleDateString([], {weekday: "short", day: "numeric", month: "numeric"});
  if (t.due_at < now && ["todo", "doing", "blocked"].includes(t.status)) return `<span class="crit">⚠ overdue ${day}</span>`;
  return d.toDateString() === today.toDateString() ? "due today" : "due " + day;
}
async function loadTodos() {
  const d = await getJSON("/api/todos?status=board" + (project ? "&project=" + encodeURIComponent(project) : ""));
  const by = {doing: [], todo: [], blocked: [], done: []};
  d.todos.forEach(t => (by[t.status === "dropped" ? "done" : t.status] || by.todo).push(t));
  $("#board").innerHTML = COLS.map(([k, label]) => `<div class="col"><h3><span>${label}</span><span class="num">${by[k].length}</span></h3>${
    by[k].map(t => card(t, d.now)).join("") || '<div class="empty" style="padding:16px">—</div>'}</div>`).join("");
  $("#board").querySelectorAll("select[data-id]").forEach(el => el.onchange = async () => {
    try { await postJSON("/api/todos/" + el.dataset.id, {status: el.value}); loadTodos(); } catch (e) { alertBox(e); }
  });
  $("#board").querySelectorAll("input[type=checkbox][data-step]").forEach(el => el.onchange = async () => {
    try { await postJSON("/api/todos/" + el.dataset.step, {status: el.checked ? "done" : "todo"}); loadTodos(); } catch (e) { alertBox(e); }
  });
  $("#updated").textContent = "updated " + new Date().toLocaleTimeString();
}
function card(t, now) {
  const [done, total] = t.progress, w = t.work;
  return `<div class="tcard"><div class="ttl">${PRIO[t.priority] ? `<b style="color:var(--series-2)">${PRIO[t.priority]}</b> ` : ""}${esc(t.title)} <span class="muted num">#${t.id}</span></div>
    <div class="row">${!project && t.project ? `<span class="chip">${esc(t.project)}</span>` : ""}${dueLabel(t, now)}
      ${total ? `<span class="prog"><span class="track"><span class="bar" style="display:block;width:${pct(done, total)}%"></span></span><span class="num">${done}/${total}</span></span>` : ""}</div>
    ${w.tasks ? `<div class="row num" data-tip="measured over ${w.tasks} task(s)${w.active_task ? " · task #" + w.active_task + " running" : ""}">${w.active_task ? '<span class="dot active" style="margin:0"></span>' : ""}${fmtTok(w.total)} tok · ${fmtCost(w.cost)} · ${fmtDur(w.active_s)} active</div>` : ""}
    <div class="row"><select data-id="${t.id}" aria-label="status of todo ${t.id}">${["todo", "doing", "blocked", "done", "dropped"].map(s => `<option ${s === t.status ? "selected" : ""}>${s}</option>`).join("")}</select>
      <span class="muted" title="pick up in Claude Code">/tally:do ${t.id}</span></div>
    ${(t.notes || t.steps.length) ? `<details><summary>${t.steps.length ? t.steps.length + " steps" : "notes"}</summary>${t.notes ? `<div class="muted" style="white-space:pre-wrap;margin:4px 0">${esc(t.notes)}</div>` : ""}
      <ul class="steps">${t.steps.map(c => `<li class="${c.status === "done" ? "done" : ""}"><input type="checkbox" data-step="${c.id}" ${c.status === "done" ? "checked" : ""} aria-label="step ${c.id} done"><span>${esc(c.title)}</span></li>`).join("")}</ul></details>` : ""}
  </div>`;
}
function alertBox(e) { $("#updated").textContent = "error: " + e.message; }
$("#addform").onsubmit = async e => {
  e.preventDefault();
  const text = $("#addtext").value.trim();
  if (!text) return;
  try { await postJSON("/api/todos", {text, project: project || null}); $("#addtext").value = ""; loadTodos(); loadProjects(); }
  catch (err) { alertBox(err); }
};

// ---------------------------------------------------------------- projects
const MODE_HELP = {track: "every session counted", tasks: "only tasks", off: "ignored", ask: "not set up yet"};
async function loadProjectsView() {
  const d = await getJSON("/api/projects?full=1");
  if (!d.projects.length) { $("#projtable").innerHTML = '<div class="empty">No projects yet.</div>'; $("#projdetail").innerHTML = ""; return; }
  $("#projtable").innerHTML = `<table><thead><tr><th>project</th><th>tracking</th><th>30 days</th><th>30d cost</th><th>all time</th><th>cost</th><th>sessions</th><th>tasks</th><th>open todos</th><th>last active</th></tr></thead><tbody>${
    d.projects.map(p => `<tr data-p="${esc(p.project)}" style="cursor:pointer"><td><b>${esc(p.project)}</b></td>
      <td><select data-mode="${esc(p.project)}" aria-label="tracking mode of ${esc(p.project)}">${(p.mode === "ask" ? ["ask"] : []).concat(["track", "tasks", "off"]).map(m => `<option value="${m}" ${m === p.mode ? "selected" : ""}>${m === "ask" ? "— set up —" : m}</option>`).join("")}</select></td>
      <td class="num">${fmtTok(p.last_30d.total)}</td><td class="num">${fmtCost(p.last_30d.cost)}</td><td class="num">${fmtTok(p.totals.total)}</td><td class="num">${fmtCost(p.totals.cost)}</td>
      <td class="num">${p.sessions}</td><td class="num">${p.tasks}</td><td class="num">${p.open_todos}</td><td class="num muted">${p.last_activity ? fmtWhen(p.last_activity) : "–"}</td></tr>`).join("")}</tbody></table>
    <div class="note" style="padding:10px 0 0">track = every session in the project is counted · tasks = only tasks you start · off = ignored</div>`;
  $("#projtable").querySelectorAll("select[data-mode]").forEach(el => { el.onclick = e => e.stopPropagation(); el.onchange = async () => {
    try { await postJSON("/api/projects/" + encodeURIComponent(el.dataset.mode), {mode: el.value}); loadProjectsView(); } catch (e) { alertBox(e); } }; });
  $("#projtable").querySelectorAll("tr[data-p]").forEach(tr => tr.onclick = () => { project = tr.dataset.p; localStorage.setItem("tc-project", project); $("#project").value = project; loadProjectDetail(project); });
  loadProjectDetail(project && d.projects.some(p => p.project === project) ? project : d.projects[0].project);
}
async function loadProjectDetail(name) {
  const st = await getJSON("/api/projects/" + encodeURIComponent(name) + "?days=&series=30");
  const peak = Math.max(...st.daily.map(x => x.total), 1);
  const W = Math.max(320, ($("#projdetail").clientWidth || 760) - 40), H = 150, bw = W / st.daily.length;
  const bars = st.daily.map((x, i) => {
    const h = x.total ? Math.max(2, (H - 20) * x.total / peak) : 0;
    return `<g data-tip="<b>${x.day}</b>${fmtFull(x.total)} tokens · ${fmtCost(x.cost)}"><rect x="${i * bw}" y="0" width="${bw}" height="${H}" fill="transparent"/>${h ? `<rect x="${i * bw + 2}" y="${H - 16 - h}" width="${bw - 4}" height="${h}" rx="3" fill="var(--seq)"/>` : ""}</g>`;
  }).join("");
  const td = st.todos, tk = st.tasks;
  $("#projdetail").innerHTML = `<div class="dhead"><h2>${esc(st.project)}</h2><div class="line"><span class="badge">${esc(st.mode)} · ${MODE_HELP[st.mode] || ""}</span>${st.path ? `<span class="muted">${esc(st.path)}</span>` : ""}</div></div>
    <div class="tiles">
      ${tile("All time", fmtTok(st.totals.total), fmtCost(st.totals.cost) + " · " + fmtFull(st.totals.calls) + " calls")}
      ${tile("Last 30 days", fmtTok(st.last_30d.total), fmtCost(st.last_30d.cost))}
      ${tile("Last 7 days", fmtTok(st.last_7d.total), fmtCost(st.last_7d.cost))}
      ${tile("Sessions", fmtFull(st.sessions), st.last_activity ? "last " + fmtWhen(st.last_activity) : "")}
      ${tile("Tasks", fmtFull(tk.count), tk.share != null ? (tk.share * 100).toFixed(0) + "% of tokens via tasks" : (tk.active ? tk.active + " active" : ""))}
      ${tile("Todos", fmtFull(td.todo + td.doing + td.blocked) + " open", td.done + " done")}
    </div>
    <div class="section"><div class="section-title">Tokens per day · last 30 days</div>
      <svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="tokens per day" style="display:block">${bars}
        <line x1="0" x2="${W}" y1="${H - 16}" y2="${H - 16}" stroke="var(--baseline)"/>
        <text x="0" y="${H - 2}" font-size="11" fill="var(--text-muted)">${st.daily[0].day}</text>
        <text x="${W}" y="${H - 2}" font-size="11" fill="var(--text-muted)" text-anchor="end">${st.daily[st.daily.length - 1].day}</text>
        <text x="0" y="12" font-size="11" fill="var(--text-muted)">peak ${fmtTok(peak)}</text></svg></div>
    ${st.by_model.length ? `<div class="section two"><div><div class="section-title">By model</div><table><thead><tr><th>model</th><th>tokens</th><th>output</th><th>cost</th></tr></thead><tbody>${st.by_model.map(m => `<tr><td>${esc(m.model)}</td><td class="num">${fmtTok(m.total)}</td><td class="num">${fmtTok(m.output)}</td><td class="num">${fmtCost(m.cost)}</td></tr>`).join("")}</tbody></table></div>
      <div><div class="section-title">Recent tasks</div><table><thead><tr><th>task</th><th>tokens</th><th>cost</th><th>active</th></tr></thead><tbody>${tk.recent.map(t => `<tr><td><a href="#tasks/${t.id}">#${t.id} ${esc(t.name)}</a></td><td class="num">${fmtTok(t.total)}</td><td class="num">${fmtCost(t.cost)}</td><td class="num">${fmtDur(t.active_s)}</td></tr>`).join("") || '<tr><td class="muted">none</td></tr>'}</tbody></table></div></div>` : ""}`;
}

const AGENTS = {claude: "Claude Code", codex: "Codex", pi: "pi"};
let sessSel = parseHash().sid || null;
let sessPoll = null, sessLoaded = 0;
$("#sdays").value = localStorage.getItem("tc-sdays") ?? "30";
$("#sagent").value = localStorage.getItem("tc-sagent") || "";
$("#sdays").onchange = e => { localStorage.setItem("tc-sdays", e.target.value); loadSessions(); };
$("#sagent").onchange = e => { localStorage.setItem("tc-sagent", e.target.value); loadSessions(); };
const shortModel = m => m.replace(/^claude-/, "").split("/").pop();
async function loadSessions(force) {
  clearTimeout(sessPoll);
  const q = new URLSearchParams({days: $("#sdays").value, agent: $("#sagent").value, project, refresh: force ? "1" : ""});
  const d = await getJSON("/api/sessions?" + q);
  sessLoaded = Date.now();
  renderSessions(d);
  const ix = d.indexing || {};
  $("#sindex").textContent = ix.running ? `reading transcripts ${ix.done}/${ix.total || "…"}`
    : d.indexed_at ? "index updated " + new Date(d.indexed_at * 1000).toLocaleTimeString() : "";
  if (ix.running && view === "sessions") sessPoll = setTimeout(() => loadSessions().catch(() => {}), 1500);
  $("#updated").textContent = "updated " + new Date().toLocaleTimeString();
  if (sessSel && !$("#sdetail")._rep) selectSession(sessSel, false);
}
function renderSessions(d) {
  const t = d.totals;
  $("#stiles").innerHTML = `<div class="tiles" style="margin-top:0;border-top:none">
    ${tile("Sessions", fmtFull(t.sessions), d.by_agent.map(a => (AGENTS[a.agent] || a.agent) + " " + a.sessions).join(" · "))}
    ${tile("Total tokens", fmtTok(t.total), fmtTok(t.output) + " output")}
    ${tile("Est. cost", fmtCost(t.cost), d.by_agent.length > 1 ? d.by_agent.map(a => (AGENTS[a.agent] || a.agent) + " " + fmtCost(a.cost)).join(" · ") : "at API list price", "Agent-reported cost where the agent records one (pi, Codex), else list price; Claude Code sessions include its own unlogged calls when its cost record exists.")}
    ${tile("Prompts", fmtFull(t.prompts), fmtFull(t.calls) + " API calls")}
    ${tile("Active time", fmtDur(t.active_s), "wall " + fmtDur(t.wall_s), "time agents were working on turns; wall = first to last API call of each session")}
  </div>`;
  if (!d.sessions.length) {
    $("#stable").innerHTML = `<div class="empty">${d.indexing && d.indexing.running ? "Reading transcripts…" : "No sessions with API calls in this period."}</div>`;
    return;
  }
  const max = Math.max(...d.sessions.map(s => s.totals.total), 1);
  $("#stable").innerHTML = `<table class="stbl"><thead><tr><th>last activity</th><th>agent</th><th>project</th><th>session</th><th>span</th><th>active</th><th>prompts</th><th>calls</th><th>tokens</th><th></th><th>cost</th><th>models</th></tr></thead><tbody>${
    d.sessions.map(s => {
      const st = s.totals, cost = st.cost_with_unlogged ?? st.cost;
      const label = s.title || s.session_id;
      const tasksHtml = s.tasks.map(x => `<a class="chip" href="#tasks/${x.id}" title="${esc(x.name)}">#${x.id}</a>`).join(" ");
      const mtip = s.models.map(m => `${esc(m.model)} · ${fmtTok(m.total)} · ${fmtCost(m.cost)}`).join("<br>");
      return `<tr data-sid="${esc(s.session_id)}" class="${s.session_id === sessSel ? "sel" : ""}">
        <td class="num">${fmtWhen(s.last_ts)}</td><td>${esc(AGENTS[s.agent] || s.agent)}</td><td>${esc(s.project || "–")}</td>
        <td class="ttl"><span title="${esc(s.session_id + (s.cwd ? " · " + s.cwd : ""))}">${tasksHtml} ${esc(label)}</span></td>
        <td class="num">${fmtDur(s.wall_s)}</td><td class="num">${fmtDur(s.active_s)}</td><td class="num">${fmtFull(s.prompts)}</td><td class="num">${fmtFull(st.calls)}</td>
        <td class="num">${fmtTok(st.total)}</td><td><div class="share"><div class="track" style="width:70px"><div class="bar" style="width:${pct(st.total, max)}%"></div></div></div></td>
        <td class="num"${s.unlogged ? ` data-tip="<b>${fmtCost(cost)}</b>incl. ≈ ${fmtCost(s.unlogged.cost)} of Claude Code's own unlogged calls"` : ""}>${fmtCost(cost, st.cost_partial)}</td>
        <td class="muted" data-tip="${esc(mtip)}">${esc(s.models.slice(0, 2).map(m => shortModel(m.model)).join(", "))}${s.models.length > 2 ? " +" + (s.models.length - 2) : ""}</td></tr>`;
    }).join("")}</tbody></table>${d.count > d.sessions.length ? `<div class="note" style="padding:10px 16px">Showing ${d.sessions.length} of ${d.count} sessions.</div>` : ""}`;
  $("#stable").querySelectorAll("tr[data-sid]").forEach(tr => tr.onclick = e => {
    if (e.target.closest("a")) return;
    selectSession(tr.dataset.sid, true);
  });
}
async function selectSession(sid, scroll) {
  sessSel = sid;
  history.replaceState(null, "", "#sessions/" + encodeURIComponent(sid));
  document.querySelectorAll(".stbl tr[data-sid]").forEach(tr => tr.classList.toggle("sel", tr.dataset.sid === sid));
  const el = $("#sdetail");
  try {
    const rep = await getJSON("/api/sessions/" + encodeURIComponent(sid));
    el.style.display = "";
    renderDetail(rep, el);
    if (scroll) el.scrollIntoView({behavior: "smooth", block: "start"});
  } catch (e) {
    el.style.display = "";
    el._rep = null;
    el.innerHTML = '<div class="empty">Session not found in the index.</div>';
  }
}

// ---------------------------------------------------------------- settings
async function loadSettings() {
  const d = await getJSON("/api/settings");
  $("#settings").innerHTML = d.settings.map(s => {
    let ctl;
    if (s.allowed === "on/off") ctl = `<select data-key="${s.key}"><option value="on" ${s.value ? "selected" : ""}>on</option><option value="off" ${!s.value ? "selected" : ""}>off</option></select>`;
    else if (s.allowed === "number") ctl = `<input data-key="${s.key}" type="number" min="0" value="${esc(s.value)}" style="width:100px">`;
    else ctl = `<select data-key="${s.key}">${s.allowed.split("|").map(v => `<option ${v === s.value ? "selected" : ""}>${v}</option>`).join("")}</select>`;
    return `<div class="setrow"><code>${s.key}</code><span>${ctl}<span class="ok" id="ok-${s.key.replace(/\./g, "-")}"></span></span><span class="d">${esc(s.description)}</span></div>`;
  }).join("");
  $("#settings").querySelectorAll("[data-key]").forEach(el => el.onchange = async () => {
    const ok = $("#ok-" + el.dataset.key.replace(/\./g, "-"));
    try { await postJSON("/api/settings", {key: el.dataset.key, value: el.value}); ok.textContent = "saved"; setTimeout(() => ok.textContent = "", 1500); }
    catch (e) { ok.textContent = e.message; }
  });
}

// ---------------------------------------------------------------- boot
async function refreshAll() {
  try { await loadTasks(); await loadDetail(); }
  catch (e) { $("#updated").textContent = "server not reachable"; }
}
$("#refresh").onclick = () => { loadProjects(); if (view === "sessions") loadSessions(true); else setView(view); };
window.addEventListener("hashchange", () => {
  const h = parseHash();
  if (h.view !== view) setView(h.view);
  if (h.view === "tasks" && h.id && h.id !== selected) { selected = h.id; renderTasks(); loadDetail(); }
  if (h.view === "sessions" && h.sid && h.sid !== sessSel) selectSession(h.sid, true);
});
loadProjects().catch(() => {}).then(() => setView(view));
setInterval(() => {
  if (document.hidden) return;
  if (view === "todos") { loadTodos().catch(() => {}); return; }
  if (view === "projects") return;
  if (view === "sessions") { if (Date.now() - sessLoaded > 30000) loadSessions().catch(() => {}); return; }
  if (view !== "tasks") return;
  const cur = tasks.find(t => t.id === selected);
  if (tasks.some(t => t.status === "active")) loadTasks().catch(() => {});
  if (cur && cur.status === "active") loadDetail();
}, 5000);
</script>
</body>
