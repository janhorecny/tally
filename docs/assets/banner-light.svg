<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Tally: per-task token and time tracking for Claude Code">
  <title>Tally: per-task token and time tracking for Claude Code</title>
  <defs>
