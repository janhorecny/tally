      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="dotmask"><rect width="1280" height="400" fill="url(#fade)"/></mask>
    <clipPath id="round"><rect width="1280" height="400" rx="18"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
