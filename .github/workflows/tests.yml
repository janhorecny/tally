name: tests

# Checks run locally: scripts/check.sh (and before every push through
# .githooks/pre-push). This workflow is disabled in the repository settings
# and only runs when started by hand, on Linux only: macOS runners are billed
# at ten times the minutes. Enable it again with: gh workflow enable tests
on:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        python: ["3.8", "3.11", "3.13"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Unit and end-to-end tests
        run: python -m unittest discover -s tests -v
      - name: Byte-compile
        run: python -m compileall -q plugin scripts
